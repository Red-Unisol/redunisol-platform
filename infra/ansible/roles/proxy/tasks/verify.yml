---
- name: Read installed Apache package versions
  ansible.builtin.package_facts:
    manager: apt

- name: Verify the reviewed Apache package version
  ansible.builtin.assert:
    that:
      - "'apache2' in ansible_facts.packages"
      - ansible_facts.packages['apache2'][0].version == foundation_proxy_package_version

- name: Validate Apache without applying changes
  ansible.builtin.command:
    argv: [/usr/sbin/apache2ctl, configtest]
  changed_when: false
  check_mode: false

- name: Read the managed listener declaration
  ansible.builtin.slurp:
    src: /etc/apache2/ports.conf
  register: foundation_proxy_ports

- name: Verify the only declared listener
  ansible.builtin.assert:
    that:
      - "(foundation_proxy_ports.content | b64decode).splitlines() | reject('match', '^\\s*(#|$)') | list == ['Listen 127.0.0.1:8088']"

- name: Check private readiness without using a proxy
  ansible.builtin.uri:
    url: "http://127.0.0.1:8088/health.txt"
    use_proxy: false
    return_content: true
    status_code: 200
  register: foundation_proxy_health
  check_mode: false

- name: Verify the readiness response
  ansible.builtin.assert:
    that:
      - foundation_proxy_health.content | trim == 'redunisol-foundation-ready'

- name: Read listening TCP sockets without changing them
  ansible.builtin.command:
    argv: [ss, -H, -ltnp]
  register: foundation_proxy_sockets
  changed_when: false
  check_mode: false

- name: Read only the foundation Apache service main process identity
  ansible.builtin.command:
    argv: [systemctl, show, apache2.service, --property=MainPID, --value]
  register: foundation_proxy_main_pid
  changed_when: false
  check_mode: false

- name: Require a live foundation Apache main process
  ansible.builtin.assert:
    that:
      - foundation_proxy_main_pid.stdout | trim is match('^[1-9][0-9]*$')
    fail_msg: Foundation Apache has no positive MainPID; another origin process cannot stand in for it.

- name: Select sockets owned by the foundation Apache main process
  ansible.builtin.set_fact:
    foundation_proxy_owned_sockets: >-
      {{ foundation_proxy_sockets.stdout_lines | select('search', 'apache2') |
         select('search', 'pid=' ~ (foundation_proxy_main_pid.stdout | trim) ~ ',') | list }}

- name: Verify Apache is actually listening only on the private address
  ansible.builtin.assert:
    that:
      - foundation_proxy_owned_sockets | length > 0
      - foundation_proxy_owned_addresses | length == foundation_proxy_owned_sockets | length
      - foundation_proxy_owned_addresses | unique | list == ['127.0.0.1:8088']
  vars:
    foundation_proxy_owned_addresses: >-
      {{ foundation_proxy_owned_sockets | map('split', none) | map(attribute=3) | list }}
