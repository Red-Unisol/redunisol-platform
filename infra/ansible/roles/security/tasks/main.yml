---
- name: Validate fail2ban settings before changing the host
  ansible.builtin.assert:
    that:
      - foundation_security_fail2ban_package is match('^fail2ban=[0-9][0-9A-Za-z.+:~_-]+$')
      - foundation_security_fail2ban_ssh_ports | length > 0
      - >-
        foundation_security_fail2ban_ssh_ports | map('int') | select('ge', 1) | select('le', 65535) | list | length
        == foundation_security_fail2ban_ssh_ports | length
      - (foundation_expected_ssh_port | default(2241) | int) in (foundation_security_fail2ban_ssh_ports | map('int') | list)
      - foundation_security_fail2ban_maxretry | int >= 3
      - foundation_security_fail2ban_findtime is match('^[1-9][0-9]*[smhd]$')
      - foundation_security_fail2ban_bantime is match('^[1-9][0-9]*[smhd]$')
      - "'127.0.0.1/8' in foundation_security_fail2ban_ignoreip"
      - >-
        foundation_security_fail2ban_ignoreip | select('match', '^[0-9A-Fa-f:./]+$') | list | length
        == foundation_security_fail2ban_ignoreip | length
    fail_msg: "Invalid fail2ban settings; the host was not modified."

- name: Describe fail2ban changes in check mode
  ansible.builtin.debug:
    msg:
      package: "{{ foundation_security_fail2ban_package }}"
      ssh_ports: "{{ foundation_security_fail2ban_ssh_ports }}"
      maxretry: "{{ foundation_security_fail2ban_maxretry }}"
      findtime: "{{ foundation_security_fail2ban_findtime }}"
      bantime: "{{ foundation_security_fail2ban_bantime }}"
      check_mode_note: "Contracts only; installation is not simulated on a host without fail2ban."
  when: ansible_check_mode

- name: Apply fail2ban only outside check mode
  when: not ansible_check_mode
  block:
    - name: Install reviewed fail2ban with the nftables ban backend
      ansible.builtin.apt:
        name:
          - "{{ foundation_security_fail2ban_package }}"
          - nftables
          - python3-systemd
        state: present
        update_cache: true
        cache_valid_time: 3600
        fail_on_autoremove: true
        policy_rc_d: 101

    - name: Create the foundation policy tool directory
      ansible.builtin.file:
        path: /usr/local/libexec/redunisol-foundation
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the read-only fail2ban policy probe
      ansible.builtin.copy:
        src: fail2ban-policy.py
        dest: "{{ foundation_security_fail2ban_policy_tool }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install the upstream SSH filter correction
      ansible.builtin.copy:
        src: sshd.local
        dest: "{{ foundation_security_fail2ban_filter_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Declare the SSH jail
      ansible.builtin.template:
        src: sshd-jail.local.j2
        dest: "{{ foundation_security_fail2ban_jail_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Test fail2ban configuration before starting or reloading
      ansible.builtin.command:
        argv: [/usr/bin/fail2ban-client, --test]
      changed_when: false

    - name: Enable fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban.service
        enabled: true
        state: started

    # Probe on every run: copy.changed cannot recover a reload lost to an
    # interrupted previous run, nor detect changes made to the live daemon.
    - name: Inspect the effective SSH policy before reconciliation
      ansible.builtin.include_tasks: probe.yml

    # Debian 1.1.0 cannot reload a named jail which is absent. A configuration
    # reload recreates it; existing jails are not explicitly restarted.
    - name: Restore a missing SSH jail from the validated configuration
      ansible.builtin.command:
        argv: [/usr/bin/fail2ban-client, reload]
      when: "'jail.absent' in (foundation_security_policy_probe.stdout | from_json).differences"
      changed_when: true

    - name: Reconcile the live SSH jail when its policy differs
      ansible.builtin.command:
        argv: [/usr/bin/fail2ban-client, reload, --restart, sshd]
      when:
        - not (foundation_security_policy_probe.stdout | from_json).matches
        - "'jail.absent' not in (foundation_security_policy_probe.stdout | from_json).differences"
      changed_when: true

    - name: Verify the effective SSH policy after reconciliation
      ansible.builtin.include_tasks: verify-policy.yml
