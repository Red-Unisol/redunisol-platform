---
# Both listen to the same notification and run in this order. A failed test stops
# before the reload, so fail2ban keeps running with its previous configuration.
- name: Test fail2ban configuration
  ansible.builtin.command:
    argv: [/usr/bin/fail2ban-client, --test]
  changed_when: false
  listen: Reload fail2ban

- name: Apply fail2ban configuration
  ansible.builtin.systemd_service:
    name: fail2ban.service
    state: reloaded
  listen: Reload fail2ban
