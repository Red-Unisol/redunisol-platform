---
- name: Validate the isolated shadow contract
  ansible.builtin.import_tasks: contract.yml

- name: Require separate authorization and a reviewed revision before shadow preparation
  ansible.builtin.assert:
    that:
      - ansible_check_mode or metamap_shadow_apply_authorized
      - ansible_check_mode or metamap_shadow_revision is match('^[0-9a-f]{40}$')
      - ansible_check_mode or metamap_shadow_runtime_env_source_file is match('^/')
    fail_msg: Shadow preparation requires its own authorization, SHA40 and a private controller environment file.

- name: Explain contract-only shadow planning
  ansible.builtin.debug:
    msg: >-
      Shadow running={{ metamap_shadow_running }}; fixed cached image, no network and a private Unix socket.
      Check mode validates contracts only; it does not inspect Docker, read secrets, create files or start any container.
  when: ansible_check_mode

- name: Prepare only the authorized isolated shadow outside check mode
  when: not ansible_check_mode
  block:
    - name: Inspect shadow ownership paths cached image and private socket before writing
      ansible.builtin.command:
        argv: [/usr/bin/python3, -, preflight]
        stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/shadow-control.py', rstrip=false) }}"
      changed_when: false

    - name: Validate the four-key private shadow environment on the controller
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "-"
          - environment
          - --file
          - "{{ metamap_shadow_runtime_env_source_file }}"
          - --revision
          - "{{ metamap_shadow_revision }}"
        stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/shadow-control.py', rstrip=false) }}"
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true

    - name: Create only shadow directories with explicit ownership
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ metamap_shadow_platform_dir }}", owner: root, group: root, mode: "0755"}
        - {path: "{{ metamap_shadow_platform_dir }}/code", owner: root, group: root, mode: "0755"}
        - {path: "{{ metamap_shadow_state_dir }}", owner: root, group: root, mode: "0750"}
        - {path: "{{ metamap_shadow_state_dir }}/data", owner: "10090", group: "10090", mode: "0700"}
        - {path: "{{ metamap_shadow_private_dir }}", owner: root, group: root, mode: "0700"}
        - {path: "{{ metamap_shadow_socket_dir }}", owner: "10090", group: www-data, mode: "0750"}

    - name: Persist the private socket directory before Docker starts after reboot
      ansible.builtin.copy:
        src: shadow-tmpfiles.conf
        dest: /etc/tmpfiles.d/redunisol-metamap-shadow.conf
        owner: root
        group: root
        mode: "0644"

    - name: Mark the new isolated state without importing application data
      ansible.builtin.copy:
        src: shadow-state.json
        dest: "{{ metamap_shadow_state_dir }}/.shadow-state.json"
        owner: root
        group: root
        mode: "0644"

    - name: Install the read-only shadow guard
      ansible.builtin.copy:
        src: shadow-control.py
        dest: "{{ metamap_shadow_platform_dir }}/shadow-control.py"
        owner: root
        group: root
        mode: "0755"

    - name: Install only the isolated receiver adapter
      ansible.builtin.copy:
        src: shadow-app.py
        dest: "{{ metamap_shadow_platform_dir }}/code/shadow_app.py"
        owner: root
        group: root
        mode: "0444"

    - name: Install the four-key private environment without logging its content
      ansible.builtin.copy:
        src: "{{ metamap_shadow_runtime_env_source_file }}"
        dest: "{{ metamap_shadow_private_dir }}/runtime.env"
        owner: root
        group: root
        mode: "0600"
        validate: >-
          /usr/bin/python3 {{ metamap_shadow_platform_dir }}/shadow-control.py environment
          --file %s --revision {{ metamap_shadow_revision }}
      no_log: true
      diff: false

    - name: Render only the isolated shadow Compose specification
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ metamap_shadow_platform_dir }}/compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Validate Compose privately without downloads builds or activation
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - compose
          - --project-name
          - "{{ metamap_shadow_project }}"
          - --file
          - "{{ metamap_shadow_platform_dir }}/compose.yml"
          - config
          - --quiet
      changed_when: false
      no_log: true

    - name: Inspect effective shadow configuration before deciding whether to recreate it
      ansible.builtin.import_tasks: inspect.yml

    - name: Require explicit running state before starting or retaining an active shadow
      ansible.builtin.assert:
        that:
          - metamap_shadow_running or not (metamap_shadow_runtime | from_json).running
        fail_msg: Shadow is running while desired state is false; use the separately authorized stop playbook.

    - name: Reconcile only the shadow project including retry after an interrupted configuration update
      ansible.builtin.command:
        argv: >-
          {{ ['docker', '--host', 'unix:///var/run/docker.sock', 'compose', '--project-name', metamap_shadow_project,
              '--file', metamap_shadow_platform_dir ~ '/compose.yml', 'up', '--detach', '--no-build', '--pull', 'never',
              '--wait', '--wait-timeout', '60'] +
             (['--force-recreate'] if (metamap_shadow_runtime | from_json).needs_recreate else []) }}
      register: metamap_shadow_started
      changed_when: >-
        not (metamap_shadow_runtime | from_json).matches or
        (metamap_shadow_started.stderr is search('(?m) (Created|Recreated|Started)$'))
      no_log: true
      when: metamap_shadow_running

    - name: Verify the complete shadow files and effective runtime
      ansible.builtin.import_tasks: verify.yml
