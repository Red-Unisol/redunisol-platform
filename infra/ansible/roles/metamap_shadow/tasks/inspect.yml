---
- name: Read the effective isolated shadow without exposing its environment
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ metamap_shadow_platform_dir }}/shadow-control.py"
      - inspect
      - --revision
      - "{{ metamap_shadow_revision }}"
      - --adapter-sha256
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/shadow-app.py', rstrip=false) | hash('sha256') }}"
  register: metamap_shadow_inspected
  changed_when: false
  check_mode: false

- name: Retain only nonsecret effective shadow metadata
  ansible.builtin.set_fact:
    metamap_shadow_runtime: "{{ metamap_shadow_inspected.stdout }}"
