---
- name: Require an independently authorized cold capture of a concrete reviewed source
  ansible.builtin.assert:
    that:
      - metamap_running | type_debug == 'bool'
      - not metamap_running
      - metamap_backup_authorized | type_debug == 'bool'
      - metamap_writers_stopped_confirmed | type_debug == 'bool'
      - ansible_check_mode or metamap_backup_authorized
      - ansible_check_mode or metamap_writers_stopped_confirmed
      - metamap_revision is match('^[0-9a-f]{40}$')
      - metamap_source_container is match('^[A-Za-z0-9][A-Za-z0-9_.-]+$')
      - metamap_source_image_id is match('^sha256:[0-9a-f]{64}$')
      - metamap_source_expected_hostname | length > 0
      - ansible_facts.nodename == metamap_source_expected_hostname
      - metamap_source_expected_machine_id is match('^[0-9a-f]{32}$')
      - metamap_source_data_dir is match('^/[A-Za-z0-9_./-]+$')
      - metamap_source_updates_dir is match('^/[A-Za-z0-9_./-]+$')
      - metamap_backup_bundle_dir is match('^/[A-Za-z0-9_./-]+$')
      - metamap_source_data_dir != '/'
      - metamap_source_updates_dir != '/'
      - metamap_backup_bundle_dir != '/'
      - "'..' not in metamap_source_data_dir.split('/')"
      - "'..' not in metamap_source_updates_dir.split('/')"
      - "'..' not in metamap_backup_bundle_dir.split('/')"
    fail_msg: Cold capture needs its own approval, immutable source identity, stopped writers and a reviewed Git SHA40.

- name: Read the reviewed migration origin identity without changing it
  ansible.builtin.slurp:
    src: /etc/machine-id
  register: metamap_source_machine_id
  no_log: true

- name: Match the immutable migration origin identity
  ansible.builtin.assert:
    that:
      - metamap_source_machine_id.content | b64decode | trim == metamap_source_expected_machine_id
    fail_msg: Migration origin identity differs from the reviewed source inventory.

- name: Capture the stopped source into a new private local bundle
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-"
      - snapshot
      - --container
      - "{{ metamap_source_container }}"
      - --expected-image-id
      - "{{ metamap_source_image_id }}"
      - --revision
      - "{{ metamap_revision }}"
      - --source-data
      - "{{ metamap_source_data_dir }}"
      - --source-updates
      - "{{ metamap_source_updates_dir }}"
      - --bundle
      - "{{ metamap_backup_bundle_dir }}"
      - --writers-stopped-confirmed
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/metamap-state.py') }}"
  register: metamap_cold_capture
  changed_when: true
  when: not ansible_check_mode

- name: Explain the cold capture scope
  ansible.builtin.debug:
    msg: >-
      {{ metamap_cold_capture.stdout if not ansible_check_mode else
         'Check mode inspected source identity and contracts only; no container inspection or data capture ran.' }}
      This is a private plaintext transfer bundle, not encrypted continuous backup or offsite protection.
      No files are transferred between hosts and no container is stopped or started.
