---
- name: Require preparation-only MetaMap settings
  ansible.builtin.assert:
    that:
      - metamap_running | type_debug == 'bool'
      - not metamap_running
      - metamap_prefetch_image | type_debug == 'bool'
      - metamap_registry_auth_file is string
      - metamap_registry_auth_file == '' or metamap_registry_auth_file is match('^/')
      - metamap_prepare_authorized | type_debug == 'bool'
      - metamap_stage_runtime_env | type_debug == 'bool'
      - metamap_pending_runtime_env_path == '/etc/redunisol-metamap/runtime.env.pending'
      - not metamap_stage_runtime_env or metamap_runtime_env_source_file is match('^/')
      - metamap_compose_project == 'metamap-server'
      - metamap_platform_dir == '/srv/redunisol/platform/metamap-server'
      - metamap_state_dir == '/srv/redunisol/state/metamap-server'
      - metamap_data_dir == metamap_state_dir ~ '/data'
      - metamap_updates_dir == metamap_state_dir ~ '/updates'
      - >-
        metamap_image == '' or
        metamap_image is match('^ghcr\.io/red-unisol/metamap-platform-server@sha256:[0-9a-f]{64}$')
    fail_msg: MetaMap preparation never activates a service; fixed private paths and a reviewed image digest are required.
