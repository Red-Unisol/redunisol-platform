---
- name: Verify journald is running after its configuration was applied
  ansible.builtin.command:
    argv: [systemctl, is-active, systemd-journald.service]
  changed_when: false
  check_mode: false

- name: Read the managed journald policy
  ansible.builtin.slurp:
    src: /etc/systemd/journald.conf.d/50-redunisol.conf
  register: foundation_journal_policy

- name: Verify bounded persistent logging
  ansible.builtin.assert:
    that:
      - "'Storage=persistent' in (foundation_journal_policy.content | b64decode)"
      - "('SystemMaxUse=' ~ foundation_journal_max_use) in (foundation_journal_policy.content | b64decode)"
      - "('SystemKeepFree=' ~ foundation_journal_keep_free) in (foundation_journal_policy.content | b64decode)"

- name: Check logrotate without rotating logs
  ansible.builtin.command:
    argv: [logrotate, --debug, /etc/logrotate.conf]
  changed_when: false
  check_mode: false

- name: Read the no-automatic-reboot policy
  ansible.builtin.slurp:
    src: /etc/apt/apt.conf.d/52redunisol-no-automatic-reboot
  register: foundation_reboot_policy

- name: Verify the no-automatic-reboot policy
  ansible.builtin.assert:
    that:
      - "'Unattended-Upgrade::Automatic-Reboot \"false\";' in (foundation_reboot_policy.content | b64decode)"
