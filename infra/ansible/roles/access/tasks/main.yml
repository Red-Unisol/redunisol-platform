---
- name: Validate declared accounts and keys before changing access
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z_][a-z0-9_-]*[$]?$')
      - item.public_keys is defined
      - item.public_keys is sequence
      - item.public_keys is not string
      - item.public_keys | length > 0
      - item.public_keys | select('match', foundation_access_public_key_pattern) | list | length == item.public_keys | length
    fail_msg: "Each managed account requires explicit public keys; no generated credentials."
  loop: "{{ foundation_access_users }}"
  loop_control:
    label: "{{ item.name | default('invalid-account') }}"

- name: Validate each supplied public key before creating an account
  ansible.builtin.command:
    argv: [/usr/bin/ssh-keygen, -l, -f, /dev/stdin]
    stdin: "{{ item }}"
  loop: "{{ foundation_access_users | map(attribute='public_keys') | flatten }}"
  loop_control:
    label: "Explicit public key"
  changed_when: false
  check_mode: false

- name: Manage only explicitly declared accounts
  ansible.builtin.include_tasks: user.yml
  loop: "{{ foundation_access_users }}"
  loop_control:
    loop_var: foundation_access_user
    label: "{{ foundation_access_user.name }}"

- name: Verify the existing SSH port remains effective
  ansible.builtin.include_tasks: verify.yml
