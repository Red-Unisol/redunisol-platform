---
- name: Capture only an explicitly inventoried stopped MetaMap migration origin
  hosts: metamap_migration_origins
  become: true
  # The inventoried migration origin may expose only Python 3.6.8. All remote
  # execution is raw; assert/debug and file lookup stay on the controller.
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Capture a cold private transfer bundle without stopping the source
      ansible.builtin.import_role:
        name: metamap_server
        tasks_from: backup
