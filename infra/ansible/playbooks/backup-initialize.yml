---
- name: Initialize only the reviewed local foundation backup repository
  hosts: foundation_hosts
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Require explicit initialization approval and reviewed source revision
      ansible.builtin.assert:
        that:
          - foundation_apply_authorized | default(false) | bool
          - foundation_backups_initialize_authorized | default(false) | bool
          - foundation_revision | default('') is match('^[0-9a-f]{40}$')
        fail_msg: Initialization needs explicit apply and backup-initialize authorization for the reviewed Git revision.
      tags: [always]
  tasks:
    - name: Confirm immutable host identity
      ansible.builtin.import_role:
        name: preflight
      tags: [always]
    - name: Initialize or validate the selected repository without scheduling backups
      ansible.builtin.import_role:
        name: backups
        tasks_from: initialize
