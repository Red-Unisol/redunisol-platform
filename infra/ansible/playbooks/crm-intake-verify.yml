---
- name: Verify the private inactive CRM intake installation
  hosts: crm_intake_hosts
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: preflight
      tags: [always]
  tasks:
    - name: Read the private installation status
      ansible.builtin.include_role:
        name: crm_intake
        tasks_from: verify
