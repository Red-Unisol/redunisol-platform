name: metamap-server
services:
  server:
    profiles: [activation]
    image: ${APP_IMAGE:?An immutable dedicated image is required}
    pull_policy: never
    environment:
      METAMAP_SERVER_GIT_SHA: ${APP_GIT_SHA:?The verified image revision is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18083:8000"
    env_file:
      - path: ./runtime.env
        required: true
        format: raw
    volumes:
      - type: bind
        source: /srv/redunisol/state/metamap-server/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/redunisol/state/metamap-server/updates
        target: /updates
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 60s
