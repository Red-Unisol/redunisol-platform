services:
  server:
    profiles: [manual-recovery]
    image: ${APP_IMAGE}
    pull_policy: always
    ports:
      - "${APP_BIND:-127.0.0.1:3031:8000}"
    env_file:
      - .env
    volumes:
      - metamap_platform_server_data:/data
      - /srv/redunisol-updates:/updates:ro
    restart: "no"

volumes:
  metamap_platform_server_data:
