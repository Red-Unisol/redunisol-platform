services:
  bcra-file-api-poc:
    image: ${BCRA_FILE_IMAGE:?Set an immutable image tag}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    environment:
      BCRA_FILE_API_TOKEN: ${BCRA_FILE_API_TOKEN:?Set the POC token}
      BCRA_FILE_TERMS_ACCEPTED: ${BCRA_FILE_TERMS_ACCEPTED:-false}
      BCRA_FILE_DATA_DIR: /data
      BCRA_FILE_REFRESH_START_HOUR: "21"
      BCRA_FILE_REFRESH_END_HOUR: "7"
      BCRA_FILE_REFRESH_TIMEZONE: America/Argentina/Buenos_Aires
      BCRA_FILE_EXTENDED_ENABLED: "true"
      BCRA_FILE_MIN_FREE_BYTES: "21474836480"
      BCRA_FILE_MAX_BUILD_BYTES: "37580963840"
    volumes:
      - bcra-file-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18082:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kestra_net
volumes:
  bcra-file-data:
    name: bcra-file-poc_bcra-file-data
networks:
  kestra_net:
    external: true
    name: kestra_net
