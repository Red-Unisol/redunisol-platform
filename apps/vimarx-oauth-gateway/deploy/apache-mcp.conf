<VirtualHost *:80>
    ServerName mcp.redunisol.com.ar
    Alias "/.well-known/acme-challenge/" "/opt/apache/htdocs/.well-known/acme-challenge/"
    <Directory "/opt/apache/htdocs/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass "/.well-known/acme-challenge/" "!"
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://mcp.redunisol.com.ar%{REQUEST_URI} [R=308,L]
    ErrorLog "logs/mcp_http_error.log"
    CustomLog "/dev/null" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName mcp.redunisol.com.ar
    SSLEngine On
    SSLCertificateFile "/etc/letsencrypt/live/mcp.redunisol.com.ar/fullchain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/mcp.redunisol.com.ar/privkey.pem"
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCompression Off
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "/" "http://127.0.0.1:3060/" retry=0 timeout=90
    ProxyPassReverse "/" "http://127.0.0.1:3060/"
    LogLevel warn
    ErrorLog "logs/mcp_https_error.log"
    # Never log authorization URLs, credentials or token requests.
    CustomLog "/dev/null" combined
</VirtualHost>
