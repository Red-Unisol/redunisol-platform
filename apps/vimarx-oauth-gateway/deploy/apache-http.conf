<VirtualHost *:80>
    ServerName mcp.redunisol.com.ar
    Alias "/.well-known/acme-challenge/" "/opt/apache/htdocs/.well-known/acme-challenge/"
    <Directory "/opt/apache/htdocs/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass "/.well-known/acme-challenge/" "!"
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://mcp.redunisol.com.ar%{REQUEST_URI} [R=308,L]
    ErrorLog "logs/mcp_http_error.log"
    CustomLog "/dev/null" combined
</VirtualHost>
