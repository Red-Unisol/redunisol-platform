# Included INSIDE the kestra.redunisol.com.ar HTTPS VirtualHost, before ProxyPass "/".
# Keep well-known discovery paths at the origin, following RFC8414/RFC9728.
ProxyPass "/.well-known/oauth-authorization-server/vimarx-oauth" "http://127.0.0.1:3060/.well-known/oauth-authorization-server/vimarx-oauth" retry=0 timeout=60
ProxyPassReverse "/.well-known/oauth-authorization-server/vimarx-oauth" "http://127.0.0.1:3060/.well-known/oauth-authorization-server/vimarx-oauth"
ProxyPass "/.well-known/oauth-protected-resource/vimarx-oauth/mcp" "http://127.0.0.1:3060/.well-known/oauth-protected-resource/vimarx-oauth/mcp" retry=0 timeout=60
ProxyPassReverse "/.well-known/oauth-protected-resource/vimarx-oauth/mcp" "http://127.0.0.1:3060/.well-known/oauth-protected-resource/vimarx-oauth/mcp"
ProxyPass "/vimarx-oauth/" "http://127.0.0.1:3060/vimarx-oauth/" retry=0 timeout=90
ProxyPassReverse "/vimarx-oauth/" "http://127.0.0.1:3060/vimarx-oauth/"
<LocationMatch "^/(vimarx-oauth/|\.well-known/oauth-(authorization-server|protected-resource)/vimarx-oauth)">
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}
    RequestHeader set X-Forwarded-Proto "https"
    # Credentials and authorization codes must not appear in frontend logs.
    SetEnv dontlog 1
</LocationMatch>
