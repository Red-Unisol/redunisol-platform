services:
  gateway:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    env_file: .env
    ports:
      - "127.0.0.1:3060:8000"
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; u=os.environ['GATEWAY_ISSUER']; p=__import__('urllib.parse',fromlist=['urlsplit']).urlsplit(u); r=urllib.request.Request('http://127.0.0.1:8000'+p.path+'/health',headers={'Host':p.netloc}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

volumes:
  gateway_data:
