# cartera-api.redunisol.com.ar: solo este dominio, detrás de Cloudflare (Full strict).
# Copia de apps/cartera-api/deploy/apache/31-cartera-api-redunisol.conf (redunisol-platform).
<VirtualHost *:80>
    ServerName cartera-api.redunisol.com.ar
    <Location "/">
        Include conf.d/31-cartera-api-cloudflare-ips.inc
    </Location>
    RewriteEngine On
    RewriteRule ^ https://cartera-api.redunisol.com.ar%{REQUEST_URI} [R=301,L]
    ErrorLog "logs/cartera_api_http_error.log"
    CustomLog "logs/cartera_api_http_access.log" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName cartera-api.redunisol.com.ar
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "/opt/apache/ssl/cloudflare-origin/cartera-api.redunisol.com.ar.pem"
    SSLCertificateKeyFile "/opt/apache/ssl/cloudflare-origin/cartera-api.redunisol.com.ar.key"
    <Location "/">
        Include conf.d/31-cartera-api-cloudflare-ips.inc
    </Location>
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass "/" "http://127.0.0.1:3070/" retry=0 timeout=120
    ProxyPassReverse "/" "http://127.0.0.1:3070/"
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog "logs/cartera_api_https_error.log"
    CustomLog "logs/cartera_api_https_access.log" combined
</VirtualHost>
