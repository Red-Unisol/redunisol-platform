# cartera-api.redunisol.com.ar — VPS Principal, Apache de Ferozo (/opt/apache/conf.d/).
# Número 31: carga después de todos los sitios existentes; no cambia el sitio por defecto.
# Aplica solo a este dominio. Va detrás de Cloudflare (proxied) con SSL "Full (strict)".
#
# - Solo acepta conexiones de Cloudflare (rangos oficiales de https://www.cloudflare.com/ips/,
#   bajados el 2026-11-20). Así CF-Connecting-IP, la IP real del cliente que lee la app,
#   no se puede falsificar conectándose directo a la VPS.
# - TLS entre Cloudflare y la VPS con un certificado de origen de Cloudflare (Origin CA).
#   El certificado y la clave NO van en Git; se dejan en el servidor en las rutas de abajo.
# - Antes de recargar Apache: verificar la configuración (configtest) y recargar en modo graceful.
# - No carga módulos ni cambia nada global: usa ssl, proxy, headers y rewrite, que el Apache ya
#   tiene cargados para los demás sitios.

<VirtualHost *:80>
    ServerName cartera-api.redunisol.com.ar

    <Location "/">
        Include conf.d/31-cartera-api-cloudflare-ips.inc
    </Location>

    RewriteEngine On
    RewriteRule ^ https://cartera-api.redunisol.com.ar%{REQUEST_URI} [R=301,L]

    ErrorLog "logs/cartera_api_http_error.log"
    CustomLog "logs/cartera_api_http_access.log" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName cartera-api.redunisol.com.ar

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "/opt/apache/ssl/cloudflare-origin/cartera-api.redunisol.com.ar.pem"
    SSLCertificateKeyFile "/opt/apache/ssl/cloudflare-origin/cartera-api.redunisol.com.ar.key"

    <Location "/">
        Include conf.d/31-cartera-api-cloudflare-ips.inc
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass "/" "http://127.0.0.1:3070/" retry=0 timeout=120
    ProxyPassReverse "/" "http://127.0.0.1:3070/"

    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog "logs/cartera_api_https_error.log"
    CustomLog "logs/cartera_api_https_access.log" combined
</VirtualHost>
