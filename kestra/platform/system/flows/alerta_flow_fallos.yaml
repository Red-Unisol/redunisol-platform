id: alerta_flow_fallos
namespace: redunisol

description: Observa ejecuciones fallidas y recuperaciones de Kestra en prod. Confirma el fallo tras los reintentos antes de alertar a Bitrix24, con deduplicacion por KV.

sla:
  - id: limitar_duracion
    type: MAX_DURATION
    duration: PT5M
    behavior: CANCEL

concurrency:
  limit: 1
  behavior: QUEUE

labels:
  env: prod
  team: redunisol
  kind: system
  scope: observability

tasks:
  # El FAILED de un reintento y el definitivo se ven igual desde el trigger. La
  # decision se delega para no alertar por un fallo que el reintento resuelve;
  # este observador solo hace tareas rapidas para no bloquear su propia cola.
  - id: confirmar_fallo
    type: io.kestra.plugin.core.flow.Subflow
    runIf: "{{ trigger.state == 'FAILED' }}"
    namespace: "{{ flow.namespace }}"
    flowId: alerta_flow_fallos_confirmar
    wait: false
    inputs:
      ejecucion: "{{ trigger.executionId }}"
      namespace_origen: "{{ trigger.namespace }}"
      flow_origen: "{{ trigger.flowId }}"

  # Marca de ejecucion resuelta: el SUCCESS del reintento llega con el mismo
  # executionId que su FAILED transitorio. El TTL corto la limita a la ventana
  # de espera de la confirmacion; no es un historial.
  - id: marcar_ejecucion_resuelta
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ trigger.state == 'SUCCESS' }}"
    key: "{{ 'alerta.flow_fallos.resuelta.' ~ trigger.executionId }}"
    value: resuelta
    overwrite: true
    ttl: PT1H

  - id: leer_alerta_abierta
    type: io.kestra.plugin.core.kv.Get
    runIf: "{{ trigger.state == 'SUCCESS' }}"
    key: "{{ 'alerta.flow_fallos.' ~ trigger.namespace ~ '.' ~ trigger.flowId }}"
    errorOnMissing: false

  - id: leer_racha_credixsa
    type: io.kestra.plugin.core.kv.Get
    runIf: "{{ trigger.state == 'SUCCESS' and trigger.namespace == 'redunisol.prod.analisis-credito' and trigger.flowId == 'consulta_quiebra_credix' }}"
    key: "{{ 'alerta.flow_fallos.racha.' ~ trigger.namespace ~ '.' ~ trigger.flowId }}"
    errorOnMissing: false

  # Un exito corta la racha, igual que la politica anterior. La racha vive en la
  # confirmacion, que es la unica que la incrementa.
  - id: limpiar_racha_credixsa
    type: io.kestra.plugin.core.kv.Delete
    runIf: "{{ trigger.state == 'SUCCESS' and ((outputs.leer_racha_credixsa.value ?? null) is not null) }}"
    key: "{{ 'alerta.flow_fallos.racha.' ~ trigger.namespace ~ '.' ~ trigger.flowId }}"

  - id: enviar_alerta_clear
    type: io.kestra.plugin.core.http.Request
    timeout: PT30S
    runIf: "{{ trigger.state == 'SUCCESS' and ((outputs.leer_alerta_abierta.value ?? null) is not null) }}"
    uri: "{{ envs.bitrix24_base_url }}/{{ secret('BITRIX24_ALERTAS_WEBHOOK_PATH') }}/im.message.add"
    method: POST
    contentType: application/json
    body: |
      {
        "DIALOG_ID": "chat119621",
        "MESSAGE": "KESTRA - Flow recuperado\n\nFlow: {{ trigger.flowId }}\nNamespace: {{ trigger.namespace }}\nEstado: {{ trigger.state }}\nEjecucion: {{ trigger.executionId }}"
      }

  - id: limpiar_alerta_abierta
    type: io.kestra.plugin.core.kv.Delete
    runIf: "{{ trigger.state == 'SUCCESS' and ((outputs.leer_alerta_abierta.value ?? null) is not null) }}"
    key: "{{ 'alerta.flow_fallos.' ~ trigger.namespace ~ '.' ~ trigger.flowId }}"

triggers:
  - id: detectar_fallos_prod
    type: io.kestra.plugin.core.trigger.Flow
    states:
      - FAILED
    when: "{{ (flow.namespace | startsWith('redunisol.prod.')) and flow.namespace != 'redunisol.prod.system' }}"

  - id: detectar_recuperaciones_prod
    type: io.kestra.plugin.core.trigger.Flow
    states:
      - SUCCESS
    when: "{{ (flow.namespace | startsWith('redunisol.prod.')) and flow.namespace != 'redunisol.prod.system' }}"
