id: alerta_flow_fallos
namespace: redunisol

description: Observa fallos y recuperaciones de prod y los entrega en orden al gestor unico de alertas.

sla:
  - id: limitar_duracion
    type: MAX_DURATION
    duration: PT5M
    behavior: CANCEL

concurrency:
  limit: 1
  behavior: QUEUE

labels:
  env: prod
  team: redunisol
  kind: system
  scope: observability

tasks:
  # Esperar al gestor conserva el orden de los eventos originales. El gestor
  # nunca duerme ni llama al temporizador: no hay ciclos entre subflows.
  - id: registrar_evento
    type: io.kestra.plugin.core.flow.Subflow
    namespace: "{{ flow.namespace }}"
    flowId: alerta_flow_fallos_gestionar
    wait: true
    transmitFailed: true
    inputs:
      evento: "{{ trigger.state }}"
      ejecucion: "{{ trigger.executionId }}"
      namespace_origen: "{{ trigger.namespace }}"
      flow_origen: "{{ trigger.flowId }}"

  # Solo el primer FAILED programa una confirmacion. La espera ocurre fuera
  # de las dos colas serializadas.
  - id: programar_confirmacion
    type: io.kestra.plugin.core.flow.Subflow
    runIf: "{{ outputs.registrar_evento.outputs.programar_confirmacion }}"
    namespace: "{{ flow.namespace }}"
    flowId: alerta_flow_fallos_confirmar
    wait: false
    inputs:
      ejecucion: "{{ trigger.executionId }}"
      namespace_origen: "{{ trigger.namespace }}"
      flow_origen: "{{ trigger.flowId }}"
      generacion: "{{ outputs.registrar_evento.outputs.generacion }}"

triggers:
  - id: detectar_fallos_prod
    type: io.kestra.plugin.core.trigger.Flow
    states:
      - FAILED
    when: "{{ (flow.namespace | startsWith('redunisol.prod.')) and flow.namespace != 'redunisol.prod.system' }}"

  - id: detectar_recuperaciones_prod
    type: io.kestra.plugin.core.trigger.Flow
    states:
      - SUCCESS
    when: "{{ (flow.namespace | startsWith('redunisol.prod.')) and flow.namespace != 'redunisol.prod.system' }}"
