<VirtualHost *:80>
    ServerName mutualcelesol.com

    Alias "/.well-known/acme-challenge/" "/opt/apache/htdocs/.well-known/acme-challenge/"
    <Directory "/opt/apache/htdocs/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    ProxyPass "/.well-known/acme-challenge/" "!"

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog "logs/mutual_celesol_http_error.log"
    CustomLog "logs/mutual_celesol_http_access.log" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName mutualcelesol.com

    SSLEngine on
    SSLCertificateFile "/etc/letsencrypt/live/mutualcelesol.com/fullchain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/mutualcelesol.com/privkey.pem"

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    Header edit Location "^http://mutualcelesol\.com/(.*)$" "https://mutualcelesol.com/$1"

    ProxyPass "/" "http://127.0.0.1:3032/" retry=0 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:3032/"

    ErrorLog "logs/mutual_celesol_https_error.log"
    CustomLog "logs/mutual_celesol_https_access.log" combined
</VirtualHost>
