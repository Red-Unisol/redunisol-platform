id: mudon_credixsa_report
namespace: redunisol

description: Construye de forma reanudable el padrón de socios MUDON con crédito activo, lo enriquece con CredixSA y publica un Excel compartido.

concurrency:
  limit: 1
  behavior: QUEUE

labels:
  env: prod
  team: redunisol
  domain: analisis-credito
  business_area: cobranzas
  kind: schedule-webhook
  integration: devexpress-credixsa
  schedule_scope: prod_only

inputs:
  - id: force_refresh
    type: BOOLEAN
    required: true
    defaults: false
    description: Ignora caches vigentes al iniciar una corrida manual nueva.
  - id: retry_errors
    type: BOOLEAN
    required: true
    defaults: false
    description: Reabre los errores definitivos de la ultima corrida.

tasks:
  - id: procesar_lote
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
      include:
        - mudon_credixsa_report/**
        - consulta_quiebra_credix/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: ALWAYS
      volumes:
        - /opt/kestra/data/credixsa-cache:/data/credixsa-cache
        - /srv/redunisol-reports:/reports
    containerImage: ghcr.io/red-unisol/analisis-credito-precalentar-cache-credixsa-v2:latest
    beforeCommands:
      - python -c "import openpyxl" 2>/dev/null || pip install --no-cache-dir openpyxl==3.1.5 > /dev/null
    env:
      TRIGGER_ID: "{{ (trigger is defined and trigger.id is defined) ? trigger.id : 'manual' }}"
      TRIGGER_BODY_JSON: "{{ (trigger is defined and trigger.body is defined) ? (trigger.body | json) : ({'force_refresh': inputs.force_refresh ?? false, 'retry_errors': inputs.retry_errors ?? false} | json) }}"
      MUDON_STATE_DB_PATH: /data/credixsa-cache/mudon-report.sqlite
      CREDIX_CACHE_SQLITE_PATH: /data/credixsa-cache/credixsa.sqlite
      REPORTS_ROOT: /reports
      MUDON_CORE_BASE_URL: "{{ secret('DEVEXPRESS_EVALUATE_API_BASE_URL') }}"
      MUDON_CORE_BEARER_TOKEN: "{{ secret('DEVEXPRESS_EVALUATE_API_BEARER_TOKEN') }}"
      MUDON_CORE_TIMEOUT_SECONDS: "{{ envs.mudon_core_timeout_seconds ?? '60' }}"
      MUDON_CORE_VERIFY_TLS: "{{ envs.mudon_core_verify_tls ?? 'false' }}"
      MUDON_CORE_MAX_ROWS: "{{ envs.mudon_core_max_rows ?? '5000' }}"
      MUDON_LOAN_LINES: "{{ envs.mudon_loan_lines ?? 'MUDON HABERES|MUDON HABERES SOCIOS NUEVOS' }}"
      MUDON_CREDIXSA_BATCH_SIZE: "{{ envs.mudon_credixsa_batch_size ?? '5' }}"
      MUDON_CREDIXSA_DELAY_SECONDS: "{{ envs.mudon_credixsa_delay_seconds ?? '15' }}"
      MUDON_CREDIXSA_CACHE_MAX_AGE_DAYS: "{{ envs.mudon_credixsa_cache_max_age_days ?? '7' }}"
      MUDON_CREDIXSA_MAX_ATTEMPTS: "{{ envs.mudon_credixsa_max_attempts ?? '3' }}"
      CREDIX_LOGIN_URL: https://www.credixsa.com/nuevo/login.php
      CREDIX_TIMEOUT_SECONDS: "{{ envs.credix_timeout_seconds ?? '90' }}"
      CREDIX_DEBUG: "{{ envs.credix_debug ?? 'false' }}"
      CREDIX_DEBUG_DIR: /data/credixsa-cache/debug
      CREDIX_CLIENTE: "{{ secret('CREDIX_CLIENTE') }}"
      CREDIX_USER: "{{ secret('CREDIX_USER') }}"
      CREDIX_PASS: "{{ secret('CREDIX_PASS') }}"
    commands:
      - python -m mudon_credixsa_report.entrypoint

outputs:
  - id: ok
    type: BOOLEAN
    value: "{{ outputs.procesar_lote.vars.ok }}"
  - id: status
    type: STRING
    value: "{{ outputs.procesar_lote.vars.status }}"
  - id: run_id
    type: STRING
    value: "{{ outputs.procesar_lote.vars.run_id }}"
  - id: total
    type: INT
    value: "{{ outputs.procesar_lote.vars.total }}"
  - id: completed
    type: INT
    value: "{{ outputs.procesar_lote.vars.completed }}"
  - id: pending
    type: INT
    value: "{{ outputs.procesar_lote.vars.pending }}"
  - id: errors
    type: INT
    value: "{{ outputs.procesar_lote.vars.errors }}"
  - id: qualifying
    type: INT
    value: "{{ outputs.procesar_lote.vars.qualifying }}"
  - id: latest_path
    type: STRING
    value: "{{ outputs.procesar_lote.vars.latest_path }}"
  - id: history_path
    type: STRING
    value: "{{ outputs.procesar_lote.vars.history_path }}"
  - id: error
    type: STRING
    value: "{{ outputs.procesar_lote.vars.error }}"

triggers:
  - id: primer_dia_del_mes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 7 1 * *"
    timezone: America/Argentina/Buenos_Aires
  - id: reanudar_corrida
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    timezone: America/Argentina/Buenos_Aires
  - id: webhook_manual
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('ANALISIS_CREDITO_WEBHOOK_KEY') }}"
    wait: false
    returnOutputs: false
    responseContentType: application/json
