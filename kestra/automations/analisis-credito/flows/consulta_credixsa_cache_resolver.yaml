id: consulta_credixsa_cache_resolver
namespace: redunisol

description: Resuelve una solicitud puntual de CredixSA usando cache KV y Playwright solo cuando hay cache miss.

inputs:
  - id: solicitud_json
    type: STRING

retry:
  type: constant
  interval: PT1M
  maxAttempts: 3
  behavior: CREATE_NEW_EXECUTION

concurrency:
  limit: 1
  behavior: QUEUE

labels:
  env: prod
  team: redunisol
  kind: subflow
  domain: analisis-credito
  integration: credixsa

tasks:
  - id: preparar_cache
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
      include:
        - consulta_quiebra_credix/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/kestrapy:latest
    env:
      TRIGGER_BODY_JSON: "{{ inputs.solicitud_json }}"
    commands:
      - python -m consulta_quiebra_credix.cache_lookup_entrypoint

  - id: leer_cache_cuil
    type: io.kestra.plugin.core.kv.Get
    key: "{{ outputs.preparar_cache.vars.cuil_cache_lookup_key }}"
    errorOnMissing: false

  - id: leer_cache_nombre
    type: io.kestra.plugin.core.kv.Get
    key: "{{ outputs.preparar_cache.vars.name_cache_lookup_key }}"
    errorOnMissing: false

  - id: responder_cache
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
      include:
        - consulta_quiebra_credix/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/kestrapy:latest
    env:
      TRIGGER_BODY_JSON: "{{ inputs.solicitud_json }}"
      CREDIX_CACHE_BY_CUIL_JSON: "{{ (outputs.leer_cache_cuil.value ?? null) | json }}"
      CREDIX_CACHE_BY_NAME_JSON: "{{ (outputs.leer_cache_nombre.value ?? null) | json }}"
      CREDIX_CACHE_MAX_AGE_DAYS: "7"
    commands:
      - python -m consulta_quiebra_credix.cache_response_entrypoint

  - id: resolver_consulta
    type: io.kestra.plugin.scripts.python.Commands
    runIf: "{{ outputs.responder_cache.vars.cache_hit == false }}"
    namespaceFiles:
      enabled: true
      include:
        - consulta_quiebra_credix/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - /opt/kestra/data/credixsa-cache:/data/credixsa-cache
    containerImage: mcr.microsoft.com/playwright/python:v1.58.0-noble
    beforeCommands:
      - pip install kestra playwright==1.58.0 > /dev/null
    env:
      TRIGGER_BODY_JSON: "{{ inputs.solicitud_json }}"
      CREDIX_LOGIN_URL: "https://www.credixsa.com/nuevo/login.php"
      CREDIX_TIMEOUT_SECONDS: "30"
      CREDIX_DEBUG: "{{ envs.credix_debug ?? 'true' }}"
      CREDIX_DEBUG_DIR: "/data/credixsa-cache/debug"
      CREDIX_CLIENTE: "{{ secret('CREDIX_CLIENTE') }}"
      CREDIX_USER: "{{ secret('CREDIX_USER') }}"
      CREDIX_PASS: "{{ secret('CREDIX_PASS') }}"
      CREDIX_CACHE_BY_CUIL_JSON: "{{ (outputs.leer_cache_cuil.value ?? null) | json }}"
      CREDIX_CACHE_BY_NAME_JSON: "{{ (outputs.leer_cache_nombre.value ?? null) | json }}"
      CREDIX_CACHE_MAX_AGE_DAYS: "7"
      CREDIX_CACHE_SQLITE_PATH: "/data/credixsa-cache/credixsa.sqlite"
    commands:
      - python -m consulta_quiebra_credix.resolver_entrypoint

  - id: guardar_cache_cuil
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.resolver_consulta is defined) and outputs.resolver_consulta.vars.cuil_cache_should_persist }}"
    key: "{{ outputs.resolver_consulta.vars.cuil_cache_key }}"
    value: "{{ outputs.resolver_consulta.vars.cache_value_json }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.resolver_consulta.vars.cache_ttl }}"

  - id: guardar_cache_nombre
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.resolver_consulta is defined) and outputs.resolver_consulta.vars.name_cache_should_persist }}"
    key: "{{ outputs.resolver_consulta.vars.name_cache_key }}"
    value: "{{ outputs.resolver_consulta.vars.cache_value_json }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.resolver_consulta.vars.cache_ttl }}"

outputs:
  - id: ok
    type: BOOLEAN
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.ok : outputs.responder_cache.vars.ok }}"
  - id: status
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.status : outputs.responder_cache.vars.status }}"
  - id: cuit
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.cuit : outputs.responder_cache.vars.cuit }}"
  - id: nombre
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.nombre : outputs.responder_cache.vars.nombre }}"
  - id: rows_json
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.rows_json : outputs.responder_cache.vars.rows_json }}"
  - id: data_json
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.data_json : outputs.responder_cache.vars.data_json }}"
  - id: normalized_json
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.normalized_json : outputs.responder_cache.vars.normalized_json }}"
  - id: response_json
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.response_json : outputs.responder_cache.vars.response_json }}"
  - id: error
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.error : outputs.responder_cache.vars.error }}"
  - id: cache_hit
    type: BOOLEAN
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.cache_hit : outputs.responder_cache.vars.cache_hit }}"
  - id: cached_at
    type: STRING
    value: "{{ (outputs.resolver_consulta is defined) ? outputs.resolver_consulta.vars.cached_at : outputs.responder_cache.vars.cached_at }}"
