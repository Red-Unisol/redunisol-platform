id: precalentar_cache_credixsa_v2_sondeo
namespace: redunisol

description: Sondea solicitudes nuevas de CredixSA y solo ejecuta el worker pesado cuando hay candidatos.

concurrency:
  limit: 1
  behavior: QUEUE

labels:
  env: prod
  team: redunisol
  kind: scheduled
  schedule_scope: prod_only
  domain: analisis-credito
  integration: credixsa
  role: probe

tasks:
  - id: leer_indice_diario
    type: io.kestra.plugin.core.kv.Get
    key: credixsa.daily.index
    errorOnMissing: false

  - id: ejecutar_sondeo
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
      include:
        - precalentar_cache_credixsa_v2/**
        - consulta_quiebra_credix/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
    containerImage: ghcr.io/kestra-io/kestrapy:latest
    env:
      CREDIX_DAILY_INDEX_JSON: "{{ (outputs.leer_indice_diario.value ?? null) | json }}"
      CREDIX_WARMUP_MAX_PER_RUN: "{{ envs.credixsa_warmup_max_per_run ?? '5' }}"
      CREDIX_WARMUP_MAX_OID_FAILURES: "{{ envs.credixsa_warmup_max_oid_failures ?? '3' }}"
      VIMARX_EVAL_BASE_URL: "{{ secret('DEVEXPRESS_EVALUATE_API_BASE_URL') }}"
      VIMARX_BEARER_TOKEN: "{{ secret('DEVEXPRESS_EVALUATE_API_BEARER_TOKEN') }}"
      VIMARX_TIMEOUT_SECONDS: "{{ envs.vimarx_timeout_seconds }}"
      VIMARX_VERIFY_TLS: "{{ envs.vimarx_verify_tls }}"
      LOCAL_TZ: "{{ envs.local_tz ?? 'America/Argentina/Buenos_Aires' }}"
    commands:
      - python -m precalentar_cache_credixsa_v2.sondeo_entrypoint

  - id: precalentar_cache
    type: io.kestra.plugin.scripts.python.Commands
    runIf: "{{ outputs.ejecutar_sondeo.vars.hay_candidatos }}"
    namespaceFiles:
      enabled: true
      include:
        - consulta_quiebra_credix/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: ALWAYS
      volumes:
        - /opt/kestra/data/credixsa-cache:/data/credixsa-cache
    containerImage: ghcr.io/red-unisol/analisis-credito-precalentar-cache-credixsa-v2:latest
    env:
      CREDIX_DAILY_INDEX_JSON: "{{ outputs.ejecutar_sondeo.vars.indice_diario_json }}"
      CREDIX_LOGIN_URL: "https://www.credixsa.com/nuevo/login.php"
      CREDIX_TIMEOUT_SECONDS: "90"
      CREDIX_DEBUG: "{{ envs.credix_debug ?? 'false' }}"
      CREDIX_DEBUG_DIR: "/data/credixsa-cache/debug"
      CREDIX_CLIENTE: "{{ secret('CREDIX_CLIENTE') }}"
      CREDIX_USER: "{{ secret('CREDIX_USER') }}"
      CREDIX_PASS: "{{ secret('CREDIX_PASS') }}"
      CREDIX_WARMUP_MAX_PER_RUN: "{{ envs.credixsa_warmup_max_per_run ?? '5' }}"
      CREDIX_WARMUP_MAX_OID_FAILURES: "{{ envs.credixsa_warmup_max_oid_failures ?? '3' }}"
      CREDIX_WARMUP_CORE_MAX_ROWS: "{{ envs.credixsa_warmup_core_max_rows ?? '1000' }}"
      CREDIX_WARMUP_RETRY_ATTEMPTS: "{{ envs.credixsa_warmup_retry_attempts ?? '2' }}"
      CREDIX_CACHE_SQLITE_PATH: "/data/credixsa-cache/credixsa.sqlite"
      VIMARX_EVAL_BASE_URL: "{{ secret('DEVEXPRESS_EVALUATE_API_BASE_URL') }}"
      VIMARX_BEARER_TOKEN: "{{ secret('DEVEXPRESS_EVALUATE_API_BEARER_TOKEN') }}"
      VIMARX_TIMEOUT_SECONDS: "{{ envs.vimarx_timeout_seconds }}"
      VIMARX_VERIFY_TLS: "{{ envs.vimarx_verify_tls }}"
      LOCAL_TZ: "{{ envs.local_tz ?? 'America/Argentina/Buenos_Aires' }}"
    commands:
      - python -m consulta_quiebra_credix.warmup_entrypoint

  - id: guardar_indice_diario
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and not outputs.precalentar_cache.vars.fatal_error }}"
    key: credixsa.daily.index
    value: "{{ outputs.precalentar_cache.vars.daily_index_json }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.daily_index_ttl }}"

  - id: guardar_cache_1
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_1_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_1_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_1_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_1_ttl }}"

  - id: guardar_cache_2
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_2_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_2_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_2_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_2_ttl }}"

  - id: guardar_cache_3
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_3_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_3_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_3_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_3_ttl }}"

  - id: guardar_cache_4
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_4_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_4_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_4_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_4_ttl }}"

  - id: guardar_cache_5
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_5_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_5_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_5_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_5_ttl }}"

  - id: guardar_cache_6
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_6_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_6_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_6_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_6_ttl }}"

  - id: guardar_cache_7
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_7_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_7_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_7_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_7_ttl }}"

  - id: guardar_cache_8
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_8_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_8_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_8_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_8_ttl }}"

  - id: guardar_cache_9
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_9_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_9_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_9_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_9_ttl }}"

  - id: guardar_cache_10
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ (outputs.precalentar_cache is defined) and outputs.precalentar_cache.vars.cache_entry_10_enabled }}"
    key: "{{ outputs.precalentar_cache.vars.cache_entry_10_key }}"
    value: "{{ outputs.precalentar_cache.vars.cache_entry_10_value }}"
    kvType: JSON
    overwrite: true
    ttl: "{{ outputs.precalentar_cache.vars.cache_entry_10_ttl }}"

  - id: fallar_si_warmup_tuvo_errores
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ (outputs.precalentar_cache is defined) and (outputs.precalentar_cache.vars.has_errors ?? false) }}"
    errorMessage: "Warmup de CredixSA finalizo con errores tecnicos. Revisar logs y outputs de precalentar_cache."

outputs:
  - id: ok
    type: BOOLEAN
    value: "{{ outputs.ejecutar_sondeo.vars.ok }}"
  - id: hay_candidatos
    type: BOOLEAN
    value: "{{ outputs.ejecutar_sondeo.vars.hay_candidatos }}"
  - id: cantidad_solicitudes
    type: STRING
    value: "{{ outputs.ejecutar_sondeo.vars.cantidad_solicitudes }}"
  - id: cantidad_candidatos
    type: STRING
    value: "{{ outputs.ejecutar_sondeo.vars.cantidad_candidatos }}"
  - id: maximo_por_corrida
    type: STRING
    value: "{{ outputs.ejecutar_sondeo.vars.maximo_por_corrida }}"
  - id: fecha_sondeo
    type: STRING
    value: "{{ outputs.ejecutar_sondeo.vars.fecha_sondeo }}"
  - id: indice_diario_json
    type: STRING
    value: "{{ outputs.ejecutar_sondeo.vars.indice_diario_json }}"
  - id: candidatos_preview_json
    type: STRING
    value: "{{ outputs.ejecutar_sondeo.vars.candidatos_preview_json }}"
  - id: error
    type: STRING
    value: "{{ outputs.ejecutar_sondeo.vars.error }}"

triggers:
  - id: cada_minuto_horario_util
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "* 7-18 * * *"
    timezone: America/Argentina/Buenos_Aires
