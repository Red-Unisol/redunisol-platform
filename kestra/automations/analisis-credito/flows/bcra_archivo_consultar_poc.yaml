id: bcra_archivo_consultar_poc
namespace: redunisol
description: POC de consulta BCRA por CUIT/CUIL/CDI desde el archivo local. Sin decisiones comerciales ni API upstream.
labels:
  env: dev
  team: redunisol
  domain: analisis-credito
  kind: webhook
  integration: bcra-file-poc
  schedule_scope: dev_only
inputs:
  - id: identificacion
    type: STRING
    required: false
tasks:
  - id: consultar
    type: io.kestra.plugin.core.http.Request
    uri: "{{ envs.bcra_file_poc_url }}/lookup"
    method: POST
    timeout: PT15S
    contentType: application/json
    body: "{{ (trigger is defined and trigger.body is defined) ? (trigger.body | toJson) : ({'identificacion': inputs.identificacion ?? ''} | toJson) }}"
    headers:
      Authorization: "Bearer {{ secret('BCRA_FILE_POC_TOKEN') }}"
    options:
      allowFailed: true
      logs: []
outputs:
  - id: status
    type: INT
    value: "{{ outputs.consultar.code }}"
  - id: data
    type: JSON
    value: "{{ json(outputs.consultar.body) }}"
triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('BCRA_FILE_POC_WEBHOOK_KEY') }}"
    wait: true
    returnOutputs: true
    responseContentType: application/json
