id: bitrix24_lead_prefill
namespace: redunisol
description: Selecciona hasta dos leads INGRESO con identidades/contactos distintos y espera su enriquecimiento en paralelo antes del siguiente lote.
concurrency:
  limit: 1
  behavior: QUEUE
labels:
  env: prod
  team: redunisol
  kind: scheduled
  schedule_scope: prod_only
  integration: bitrix24
inputs:
- id: date_from
  type: STRING
  required: true
  defaults: '2026-07-21T00:00:00-03:00'
- id: max_attempts
  type: INT
  required: true
  defaults: 3
tasks:
- id: seleccionar_lote
  type: io.kestra.plugin.scripts.python.Commands
  namespaceFiles:
    enabled: true
    include:
    - bitrix24_form_flow/**
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    pullPolicy: IF_NOT_PRESENT
  containerImage: ghcr.io/kestra-io/kestrapy@sha256:cd587a1497ecc19f4a298c4df9f4053972d0af983562e6a75066f7bea1c90b51
  env:
    BACKFILL_DATE_FROM: '{{ inputs.date_from }}'
    BITRIX24_BASE_URL: '{{ envs.bitrix24_base_url }}'
    BITRIX24_WEBHOOK_PATH: '{{ secret(''BITRIX24_WEBHOOK_PATH'') }}'
    BITRIX24_CONTACT_CUIL_FIELD: '{{ envs.bitrix24_contact_cuil_field }}'
    BITRIX24_LEAD_CUIL_FIELD: '{{ envs.bitrix24_lead_cuil_field }}'
    BITRIX24_LEAD_DNI_FIELD: '{{ envs.bitrix24_lead_dni_field ?? ''UF_CRM_LEAD_1711392404332'' }}'
    BITRIX24_LEAD_SOURCE_FIELD: '{{ envs.bitrix24_lead_source_field }}'
    BITRIX24_LEAD_BACKFILL_ATTEMPTS_FIELD: '{{ envs.bitrix24_lead_backfill_attempts_field ?? ''UF_CRM_KSTRA_BF_ATTEMPTS'' }}'
    BITRIX24_LEAD_STATUS_NEW: '{{ envs.bitrix24_lead_status_new ?? ''UC_5N2OEO'' }}'
    BITRIX24_LEAD_STATUS_PRECLASSIFICATION: '{{ envs.bitrix24_lead_status_preclassification ?? ''NEW'' }}'
    BITRIX24_LEAD_STATUS_QUALIFIED: '{{ envs.bitrix24_lead_status_qualified }}'
    BITRIX24_LEAD_STATUS_REJECTED: '{{ envs.bitrix24_lead_status_rejected }}'
    BITRIX24_TIMEOUT_SECONDS: '{{ envs.bitrix24_timeout_seconds }}'
  commands:
  - python -m bitrix24_form_flow.kestra_lead_prefill_batch_select_entrypoint
- id: procesar_lote
  type: io.kestra.plugin.core.flow.Parallel
  concurrent: 2
  tasks:
  - id: procesar_1
    type: io.kestra.plugin.core.flow.Subflow
    runIf: '{{ outputs.seleccionar_lote.vars.count > 0 }}'
    namespace: '{{ flow.namespace }}'
    flowId: bitrix24_lead_prefill_one
    inputs:
      lead_id: '{{ outputs.seleccionar_lote.vars.leads[0].lead_id }}'
      cuil: '{{ outputs.seleccionar_lote.vars.leads[0].cuil }}'
      dni: '{{ outputs.seleccionar_lote.vars.leads[0].dni }}'
      source_id: '{{ outputs.seleccionar_lote.vars.leads[0].source_id }}'
      credix_identifier: '{{ outputs.seleccionar_lote.vars.leads[0].credix_identifier }}'
      max_attempts: '{{ inputs.max_attempts }}'
    wait: true
    transmitFailed: false
  - id: procesar_2
    type: io.kestra.plugin.core.flow.Subflow
    runIf: '{{ outputs.seleccionar_lote.vars.count > 1 }}'
    namespace: '{{ flow.namespace }}'
    flowId: bitrix24_lead_prefill_one
    inputs:
      lead_id: '{{ outputs.seleccionar_lote.vars.leads[1].lead_id }}'
      cuil: '{{ outputs.seleccionar_lote.vars.leads[1].cuil }}'
      dni: '{{ outputs.seleccionar_lote.vars.leads[1].dni }}'
      source_id: '{{ outputs.seleccionar_lote.vars.leads[1].source_id }}'
      credix_identifier: '{{ outputs.seleccionar_lote.vars.leads[1].credix_identifier }}'
      max_attempts: '{{ inputs.max_attempts }}'
    wait: true
    transmitFailed: false
- id: verificar_lote
  type: io.kestra.plugin.core.execution.Assert
  conditions:
  - '{{ outputs.seleccionar_lote.vars.count > 0 ? outputs.procesar_1.state == ''SUCCESS'' : true }}'
  - '{{ outputs.seleccionar_lote.vars.count > 1 ? outputs.procesar_2.state == ''SUCCESS'' : true }}'
outputs:
- id: lead_ids
  type: ARRAY
  value: '{{ outputs.seleccionar_lote.vars.lead_ids }}'
- id: count
  type: INT
  value: '{{ outputs.seleccionar_lote.vars.count }}'
triggers:
- id: cada_minuto
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '* * * * *'
