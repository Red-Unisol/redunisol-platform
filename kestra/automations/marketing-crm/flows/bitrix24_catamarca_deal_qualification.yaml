id: bitrix24_catamarca_deal_qualification
namespace: redunisol

description: Clasifica negociaciones internas pendientes, aplica reglas comerciales y distribuye por bucket.

concurrency:
  limit: 1
  behavior: QUEUE

labels:
  env: prod
  team: redunisol
  kind: scheduled
  schedule_scope: prod_only
  integration: bitrix24

tasks:
  - id: seleccionar_negociacion
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
      include:
        - bitrix24_form_flow/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/pydata:latest
    beforeCommands:
      - pip install kestra > /dev/null
    env: &bitrix_env
      BITRIX24_BASE_URL: "{{ envs.bitrix24_base_url }}"
      BITRIX24_WEBHOOK_PATH: "{{ secret('BITRIX24_WEBHOOK_PATH') }}"
      BITRIX24_CONTACT_CUIL_FIELD: "{{ envs.bitrix24_contact_cuil_field }}"
      BITRIX24_LEAD_COMMERCIAL_OWNER_FIELD: "{{ envs.bitrix24_lead_commercial_owner_field ?? 'UF_CRM_COMM_OWNER' }}"
      BITRIX24_LEAD_CUIL_FIELD: "{{ envs.bitrix24_lead_cuil_field }}"
      BITRIX24_LEAD_EMPLOYMENT_STATUS_FIELD: "{{ envs.bitrix24_lead_employment_status_field }}"
      BITRIX24_LEAD_PAYMENT_BANK_FIELD: "{{ envs.bitrix24_lead_payment_bank_field }}"
      BITRIX24_LEAD_PROVINCE_FIELD: "{{ envs.bitrix24_lead_province_field }}"
      BITRIX24_LEAD_SOURCE_FIELD: "{{ envs.bitrix24_lead_source_field }}"
      BITRIX24_LEAD_REJECTION_REASON_FIELD: "{{ envs.bitrix24_lead_rejection_reason_field }}"
      BITRIX24_LEAD_BCRA_DATA_RAW_FIELD: "{{ envs.bitrix24_lead_bcra_data_raw_field }}"
      BITRIX24_LEAD_ES_SOCIO_FIELD: "{{ envs.bitrix24_lead_es_socio_field ?? 'UF_CRM_1728998183' }}"
      BITRIX24_LEAD_VIMARX_CREDITOS_ACTIVOS_COUNT_FIELD: "{{ envs.bitrix24_lead_vimarx_creditos_activos_count_field ?? 'UF_CRM_VIMARX_CRED_ACT_CNT' }}"
      BITRIX24_LEAD_STATUS_QUALIFIED: "{{ envs.bitrix24_lead_status_qualified }}"
      BITRIX24_LEAD_STATUS_REJECTED: "{{ envs.bitrix24_lead_status_rejected }}"
      BITRIX24_DEAL_CATEGORY_ID: "{{ envs.bitrix24_deal_category_id ?? '1' }}"
      BITRIX24_DEAL_STAGE_ID: "{{ envs.bitrix24_deal_stage_id ?? 'C1:NEW' }}"
      BITRIX24_DEAL_PENDING_QUALIFICATION_STAGE_ID: "{{ envs.bitrix24_deal_pending_qualification_stage_id ?? 'C1:KESTRA_PENDING' }}"
      BITRIX24_DEAL_MANUAL_REVIEW_STAGE_ID: "{{ envs.bitrix24_deal_manual_review_stage_id ?? 'C1:KESTRA_REVIEW' }}"
      BITRIX24_DEAL_ROUTING_REVIEW_STAGE_ID: "{{ envs.bitrix24_deal_routing_review_stage_id ?? 'C1:KESTRA_ROUTE_REVIEW' }}"
      BITRIX24_DEAL_BCRA_REJECTED_STAGE_ID: "{{ envs.bitrix24_deal_bcra_rejected_stage_id ?? 'C1:5' }}"
      BITRIX24_DEAL_COMMERCIAL_REJECTED_STAGE_ID: "{{ envs.bitrix24_deal_commercial_rejected_stage_id ?? 'C1:KESTRA_REVIEW' }}"
      BITRIX24_DEAL_PROVISIONAL_USER_ID: "{{ envs.bitrix24_deal_provisional_user_id ?? '57' }}"
      BITRIX24_DEAL_DISTRIBUTION_NOTIFICATION_USER_ID: "{{ envs.bitrix24_deal_distribution_notification_user_id ?? '57' }}"
      BITRIX24_DEAL_COMMERCIAL_LINE_FIELD: "{{ envs.bitrix24_deal_commercial_line_field ?? 'ufCrm_659EBB0445E8E' }}"
      BITRIX24_DEAL_ROUTING_BUCKET_FIELD: "{{ envs.bitrix24_deal_routing_bucket_field ?? 'ufCrmRouteBucket' }}"
      BITRIX24_DEAL_ROUND_ROBIN_USER_IDS: "{{ envs.bitrix24_deal_round_robin_user_ids ?? '68579,10451,29,90231,71159,113457,113455' }}"
      BITRIX24_DEAL_ROUND_ROBIN_LOOKBACK_DAYS: "{{ envs.bitrix24_deal_round_robin_lookback_days ?? '30' }}"
      BITRIX24_DEAL_BCRA_MAX_AGE_DAYS: "{{ envs.bitrix24_deal_bcra_max_age_days ?? '7' }}"
      BITRIX24_DEAL_CORDOBA_PUBLICO_POLICIA_USER_IDS: "{{ envs.bitrix24_deal_cordoba_publico_policia_user_ids ?? '74365' }}"
      BITRIX24_DEAL_CORDOBA_JUBILADOS_USER_IDS: "{{ envs.bitrix24_deal_cordoba_jubilados_user_ids ?? '10451,71159,68579,90231,29,110059' }}"
      BITRIX24_DEAL_CORDOBA_UNC_USER_IDS: "{{ envs.bitrix24_deal_cordoba_unc_user_ids ?? '53121' }}"
      BITRIX24_DEAL_CORDOBA_GENERAL_USER_IDS: "{{ envs.bitrix24_deal_cordoba_general_user_ids ?? '10451,71159,68579,90231,29' }}"
      BITRIX24_DISTRIBUTION_BUSINESS_HOURS_ONLY: "{{ envs.bitrix24_distribution_business_hours_only ?? 'true' }}"
      BITRIX24_DISTRIBUTION_TIMEZONE: "{{ envs.bitrix24_distribution_timezone ?? 'America/Argentina/Cordoba' }}"
      BITRIX24_DISTRIBUTION_WORKDAYS: "{{ envs.bitrix24_distribution_workdays ?? 'MO,TU,WE,TH,FR' }}"
      BITRIX24_DISTRIBUTION_FROM: "{{ envs.bitrix24_distribution_from ?? '09:00' }}"
      BITRIX24_DISTRIBUTION_TO: "{{ envs.bitrix24_distribution_to ?? '17:00' }}"
      BITRIX24_TIMEOUT_SECONDS: "{{ envs.bitrix24_timeout_seconds }}"
    commands:
      - python -m bitrix24_form_flow.kestra_catamarca_deal_select_entrypoint

  - id: calificar_negociacion
    type: io.kestra.plugin.scripts.python.Commands
    runIf: "{{ outputs.seleccionar_negociacion.vars.has_pending }}"
    namespaceFiles:
      enabled: true
      include:
        - bitrix24_form_flow/**
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/pydata:latest
    beforeCommands:
      - pip install kestra > /dev/null
    env:
      <<: *bitrix_env
      DEAL_ID: "{{ outputs.seleccionar_negociacion.vars.deal_id }}"
    commands:
      - python -m bitrix24_form_flow.kestra_catamarca_deal_qualification_entrypoint

outputs:
  - id: ok
    type: BOOLEAN
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.ok : outputs.seleccionar_negociacion.vars.ok }}"
  - id: trace_schema_version
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.trace_schema_version : outputs.seleccionar_negociacion.vars.trace_schema_version }}"
  - id: event_type
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.event_type : outputs.seleccionar_negociacion.vars.event_type }}"
  - id: action
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.action : outputs.seleccionar_negociacion.vars.action }}"
  - id: business_decision
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.business_decision : outputs.seleccionar_negociacion.vars.business_decision }}"
  - id: business_reason
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.business_reason : outputs.seleccionar_negociacion.vars.business_reason }}"
  - id: deal_id
    type: STRING
    value: "{{ outputs.seleccionar_negociacion.vars.deal_id }}"
  - id: lead_id
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.lead_id : outputs.seleccionar_negociacion.vars.lead_id }}"
  - id: stage_id
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.stage_id : '' }}"
  - id: reason
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.reason : '' }}"
  - id: assigned_by_id
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars.assigned_by_id is defined ? outputs.calificar_negociacion.vars.assigned_by_id : '' }}"
  - id: assigned_by_name
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.assigned_by_name : '' }}"
  - id: previous_assigned_by_id
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars.previous_assigned_by_id is defined ? outputs.calificar_negociacion.vars.previous_assigned_by_id : '' }}"
  - id: routing_bucket
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.routing_bucket : '' }}"
  - id: commercial_line
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars.commercial_line is defined ? outputs.calificar_negociacion.vars.commercial_line : '' }}"
  - id: processed_at
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.processed_at : '' }}"
  - id: contact_id
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars.contact_id is defined ? outputs.calificar_negociacion.vars.contact_id : '' }}"
  - id: deal_title
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.deal_title : '' }}"
  - id: stage_before
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.stage_before : '' }}"
  - id: province
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.province : '' }}"
  - id: employment_status
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.employment_status : '' }}"
  - id: payment_bank
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.payment_bank : '' }}"
  - id: source
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.source : '' }}"
  - id: within_business_hours
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.within_business_hours : '' }}"
  - id: assignment_strategy
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.assignment_strategy : '' }}"
  - id: configured_pool
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.configured_pool : '' }}"
  - id: online_pool
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.online_pool : '' }}"
  - id: linked_activity_count
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.linked_activity_count : '0' }}"
  - id: transferred_chat_count
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.transferred_chat_count : '0' }}"
  - id: rule_version
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.rule_version : '' }}"
  - id: bcra_snapshot_checked_at
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.bcra_snapshot_checked_at : '' }}"
  - id: bcra_snapshot_age_days
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.bcra_snapshot_age_days : '' }}"
  - id: bcra_snapshot_refreshed
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.bcra_snapshot_refreshed : false }}"
  - id: bcra_refresh_outcome
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.bcra_refresh_outcome : 'not_evaluated' }}"
  - id: message
    type: STRING
    value: "{{ outputs.calificar_negociacion.vars is defined ? outputs.calificar_negociacion.vars.message : outputs.seleccionar_negociacion.vars.message }}"

triggers:
  - id: cada_minuto
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "* * * * *"
