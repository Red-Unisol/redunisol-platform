id: edna_incoming_webhook
namespace: redunisol

description: Clasifica eventos de Edna y decide calendario, elegibilidad y texto de los avisos de Ventas; el adaptador ejecuta los envíos.

labels:
  env: prod
  team: redunisol
  kind: webhook
  integration: edna

tasks:
  - id: recibir
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
      include:
        - edna_incoming/**
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      request.json: "{{ trigger.body | toJson }}"
    outputFiles:
      - event.json
    env:
      EDNA_INCOMING_SUBJECT_ID: "{{ envs.edna_incoming_subject_id ?? '' }}"
    commands:
      - python -m edna_incoming.entrypoint

outputs:
  - id: policy_version
    type: STRING
    value: "{{ outputs.recibir.vars.policy_version ?? '' }}"
  - id: request_id
    type: STRING
    value: "{{ outputs.recibir.vars.request_id ?? '' }}"
  - id: decision
    type: STRING
    value: "{{ outputs.recibir.vars.decision ?? '' }}"
  - id: window_start
    type: STRING
    value: "{{ outputs.recibir.vars.window_start ?? '' }}"
  - id: window_end
    type: STRING
    value: "{{ outputs.recibir.vars.window_end ?? '' }}"
  - id: notice_type
    type: STRING
    value: "{{ outputs.recibir.vars.notice_type ?? '' }}"
  - id: message_template
    type: STRING
    value: "{{ outputs.recibir.vars.message_template ?? '' }}"
  - id: context_requirements
    type: STRING
    value: "{{ outputs.recibir.vars.context_requirements ?? '' }}"
  - id: calendar
    type: STRING
    value: "{{ outputs.recibir.vars.calendar ?? '' }}"
  - id: out_of_hours_candidate
    type: BOOL
    value: "{{ outputs.recibir.vars.out_of_hours_candidate ?? false }}"
  - id: ok
    type: BOOL
    value: "{{ outputs.recibir.vars.ok }}"
  - id: event_key
    type: STRING
    value: "{{ outputs.recibir.vars.event_key }}"
  - id: kind
    type: STRING
    value: "{{ outputs.recibir.vars.kind }}"
  - id: reason
    type: STRING
    value: "{{ outputs.recibir.vars.reason }}"
  - id: flow_id_verified
    type: BOOL
    value: "{{ outputs.recibir.vars.flow_id_verified ?? false }}"

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('EDNA_INCOMING_WEBHOOK_KEY') }}"
    wait: true
    returnOutputs: true
    responseContentType: application/json
