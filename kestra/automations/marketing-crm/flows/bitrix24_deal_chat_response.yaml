id: bitrix24_deal_chat_response
namespace: redunisol
description: Atiende avisos de actividad y reconciliacion acotada con lease compartido, presupuesto y ritmo reservado para la calificacion.

concurrency:
  limit: 1
  behavior: CANCEL
labels:
  env: prod
  team: redunisol
  kind: scheduled
  schedule_scope: prod_only
  integration: bitrix24

tasks:
  - id: revisar_chats
    type: io.kestra.plugin.scripts.python.Commands
    timeout: PT2M
    namespaceFiles:
      enabled: true
      include:
        - bitrix24_form_flow/**
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      BITRIX24_BASE_URL: "{{ envs.bitrix24_base_url }}"
      BITRIX24_WEBHOOK_PATH: "{{ secret('BITRIX24_WEBHOOK_PATH') }}"
      BITRIX24_CONTACT_CUIL_FIELD: "{{ envs.bitrix24_contact_cuil_field }}"
      BITRIX24_LEAD_STATUS_QUALIFIED: "{{ envs.bitrix24_lead_status_qualified }}"
      BITRIX24_LEAD_STATUS_REJECTED: "{{ envs.bitrix24_lead_status_rejected }}"
      BITRIX24_TIMEOUT_SECONDS: "20"
      CHAT_RESPONSE_QUEUE_URL: "https://redunisol.com.ar/api/internal/bitrix-chat-response"
      CHAT_RESPONSE_QUEUE_TOKEN: "{{ secret('BITRIX24_ROUTING_ALLOCATION_TOKEN') }}"
      CHAT_RESPONSE_SCOPE: "{{ flow.namespace }}"
    commands:
      - python -m bitrix24_form_flow.kestra_chat_response_worker_entrypoint

outputs:
  - id: ok
    type: BOOL
    value: "{{ outputs.revisar_chats.vars.ok }}"
  - id: result_json
    type: STRING
    value: "{{ outputs.revisar_chats.vars.result_json }}"

triggers:
  - id: cada_dos_minutos
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "* * * * *"
    recoverMissedSchedules: NONE
