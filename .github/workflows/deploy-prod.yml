name: Deploy Prod

on:
  push:
    branches:
      - main
    paths:
      - 'kestra/automations/**'
      - 'kestra/platform/system/**'
      - 'kestra/tools/deploy_kestra.py'
      - 'kestra/tools/reconcile_marketing_crm.py'
      - 'kestra/tools/requirements.txt'
      - '.github/workflows/deploy-prod.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to deploy
        required: true
        type: choice
        options:
          - marketing-crm
          - analisis-credito
          - ahorros-amt
          - cobranzas
          - contabilidad

jobs:
  guard-manual-prod-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Allow manual prod deploy only from main by Nasst
        shell: bash
        run: |
          set -euo pipefail
          [ "${GITHUB_ACTOR}" = "Nasst" ]
          [ "${GITHUB_REF}" = "refs/heads/main" ]

  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      marketing-crm: ${{ steps.filter.outputs.marketing-crm }}
      analisis-credito: ${{ steps.filter.outputs.analisis-credito }}
      ahorros-amt: ${{ steps.filter.outputs.ahorros-amt }}
      cobranzas: ${{ steps.filter.outputs.cobranzas }}
      contabilidad: ${{ steps.filter.outputs.contabilidad }}
      system: ${{ steps.filter.outputs.system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed domains
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            marketing-crm:
              - 'kestra/automations/marketing-crm/**'
              - 'kestra/tools/deploy_kestra.py'
              - 'kestra/tools/reconcile_marketing_crm.py'
              - 'kestra/tools/requirements.txt'
            analisis-credito:
              - 'kestra/automations/analisis-credito/**'
              - 'kestra/tools/deploy_kestra.py'
            ahorros-amt:
              - 'kestra/automations/ahorros-amt/**'
              - 'kestra/tools/deploy_kestra.py'
            cobranzas:
              - 'kestra/automations/cobranzas/**'
              - 'kestra/tools/deploy_kestra.py'
            contabilidad:
              - 'kestra/automations/contabilidad/**'
              - 'kestra/tools/deploy_kestra.py'
            system:
              - 'kestra/platform/system/**'
              - 'kestra/tools/deploy_kestra.py'

  check-marketing-crm:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: kestra-prod
      deployment: false
    outputs:
      needed: ${{ steps.receipt.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r kestra/tools/requirements.txt
      - name: Compare main with the last completed CRM deployment
        id: receipt
        run: python kestra/tools/reconcile_marketing_crm.py check
        env:
          KESTRA_URL: ${{ secrets.KESTRA_URL }}
          KESTRA_USERNAME: ${{ secrets.KESTRA_USERNAME }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          KESTRA_TENANT: ${{ secrets.KESTRA_TENANT }}

  deploy-prod-marketing-crm:
    runs-on: ubuntu-latest
    environment: kestra-prod
    concurrency:
      group: kestra-prod-runtime
      cancel-in-progress: false
      queue: max
    needs:
      - guard-manual-prod-dispatch
      - detect-changes
      - check-marketing-crm
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && inputs.domain == 'marketing-crm' && needs.guard-manual-prod-dispatch.result == 'success') ||
       (github.event_name == 'push' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.marketing-crm == 'true') ||
       (github.event_name == 'schedule' && needs.check-marketing-crm.result == 'success' && needs.check-marketing-crm.outputs.needed == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r kestra/tools/requirements.txt

      - name: Deploy Marketing CRM to prod
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          relevant_paths=(
            kestra/automations/marketing-crm/flows kestra/automations/marketing-crm/files
            kestra/tools/deploy_kestra.py kestra/tools/reconcile_marketing_crm.py
            kestra/tools/requirements.txt .github/workflows/deploy-prod.yml
          )
          if git diff --quiet HEAD FETCH_HEAD -- "${relevant_paths[@]}"; then
            args=(apply)
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then args+=(--force); fi
            python kestra/tools/reconcile_marketing_crm.py "${args[@]}"
          else
            status=$?
            if [[ "$status" != 1 ]]; then exit "$status"; fi
            echo "::notice::A newer CRM deployment is desired on main. Skipping this superseded run."
          fi
        env:
          KESTRA_URL: ${{ secrets.KESTRA_URL }}
          KESTRA_USERNAME: ${{ secrets.KESTRA_USERNAME }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          KESTRA_TENANT: ${{ secrets.KESTRA_TENANT }}

  deploy-prod-analisis-credito:
    runs-on: ubuntu-latest
    environment: kestra-prod
    needs:
      - guard-manual-prod-dispatch
      - detect-changes
    if: >-
      always() &&
      (needs.guard-manual-prod-dispatch.result == 'success' || needs.guard-manual-prod-dispatch.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && inputs.domain == 'analisis-credito') ||
      (github.event_name == 'push' && needs.detect-changes.outputs.analisis-credito == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r kestra/tools/requirements.txt

      - name: Deploy Analisis Credito to prod
        run: python kestra/tools/deploy_kestra.py --environment prod --domain analisis-credito
        env:
          KESTRA_URL: ${{ secrets.KESTRA_URL }}
          KESTRA_USERNAME: ${{ secrets.KESTRA_USERNAME }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          KESTRA_TENANT: ${{ secrets.KESTRA_TENANT }}

  deploy-prod-ahorros-amt:
    runs-on: ubuntu-latest
    environment: kestra-prod
    needs:
      - guard-manual-prod-dispatch
      - detect-changes
    if: >-
      always() &&
      (needs.guard-manual-prod-dispatch.result == 'success' || needs.guard-manual-prod-dispatch.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && inputs.domain == 'ahorros-amt') ||
      (github.event_name == 'push' && needs.detect-changes.outputs.ahorros-amt == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r kestra/tools/requirements.txt

      - name: Deploy Ahorros Amt to prod
        run: python kestra/tools/deploy_kestra.py --environment prod --domain ahorros-amt
        env:
          KESTRA_URL: ${{ secrets.KESTRA_URL }}
          KESTRA_USERNAME: ${{ secrets.KESTRA_USERNAME }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          KESTRA_TENANT: ${{ secrets.KESTRA_TENANT }}

  deploy-prod-cobranzas:
    runs-on: ubuntu-latest
    environment: kestra-prod
    needs:
      - guard-manual-prod-dispatch
      - detect-changes
    if: >-
      always() &&
      (needs.guard-manual-prod-dispatch.result == 'success' || needs.guard-manual-prod-dispatch.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && inputs.domain == 'cobranzas') ||
      (github.event_name == 'push' && needs.detect-changes.outputs.cobranzas == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r kestra/tools/requirements.txt

      - name: Deploy Cobranzas to prod
        run: python kestra/tools/deploy_kestra.py --environment prod --domain cobranzas
        env:
          KESTRA_URL: ${{ secrets.KESTRA_URL }}
          KESTRA_USERNAME: ${{ secrets.KESTRA_USERNAME }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          KESTRA_TENANT: ${{ secrets.KESTRA_TENANT }}

  deploy-prod-contabilidad:
    runs-on: ubuntu-latest
    environment: kestra-prod
    needs:
      - guard-manual-prod-dispatch
      - detect-changes
    if: >-
      always() &&
      (needs.guard-manual-prod-dispatch.result == 'success' || needs.guard-manual-prod-dispatch.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && inputs.domain == 'contabilidad') ||
      (github.event_name == 'push' && needs.detect-changes.outputs.contabilidad == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r kestra/tools/requirements.txt

      - name: Deploy Contabilidad to prod
        run: python kestra/tools/deploy_kestra.py --environment prod --domain contabilidad
        env:
          KESTRA_URL: ${{ secrets.KESTRA_URL }}
          KESTRA_USERNAME: ${{ secrets.KESTRA_USERNAME }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          KESTRA_TENANT: ${{ secrets.KESTRA_TENANT }}

  deploy-prod-system:
    # Do not promote the current system alert flow to main/prod as-is.
    # It is currently scoped to redunisol.dev.* and needs prod-specific filters first.
    runs-on: ubuntu-latest
    environment: kestra-prod
    needs:
      - guard-manual-prod-dispatch
      - detect-changes
    if: >-
      always() &&
      (needs.guard-manual-prod-dispatch.result == 'success' || needs.guard-manual-prod-dispatch.result == 'skipped') &&
      (github.event_name == 'push' && needs.detect-changes.outputs.system == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r kestra/tools/requirements.txt

      - name: Deploy System to prod
        run: python kestra/tools/deploy_kestra.py --environment prod --target system
        env:
          KESTRA_URL: ${{ secrets.KESTRA_URL }}
          KESTRA_USERNAME: ${{ secrets.KESTRA_USERNAME }}
          KESTRA_PASSWORD: ${{ secrets.KESTRA_PASSWORD }}
          KESTRA_TENANT: ${{ secrets.KESTRA_TENANT }}
