name: Validate CRM intake

'on':
  pull_request:
    paths:
      - 'apps/crm-intake/**'
      - '.github/workflows/validate-crm-intake.yml'
      - 'infra/ansible/roles/crm_intake/**'
  push:
    branches: [main]
    paths:
      - 'apps/crm-intake/**'
      - '.github/workflows/validate-crm-intake.yml'
      - 'infra/ansible/roles/crm_intake/**'

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_intake_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_intake_test"
          --health-interval 2s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/crm-intake
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the test database driver
        run: python -m pip install "psycopg[binary]==3.3.9"
      - name: Exercise capture, normalization, PostgreSQL and inactive status
        env:
          CRM_INTAKE_TEST_DSN: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/crm_intake_test
        run: python -B -m unittest discover -s tests -v
