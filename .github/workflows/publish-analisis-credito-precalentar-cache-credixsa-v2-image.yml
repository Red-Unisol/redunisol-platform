name: Publish Analisis Credito Precalentar Cache CredixSA V2 Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "kestra/automations/analisis-credito/docker/precalentar-cache-credixsa-v2/**"
      - "kestra/automations/analisis-credito/flows/precalentar_cache_credixsa_v2_sondeo.yaml"
      - ".github/workflows/publish-analisis-credito-precalentar-cache-credixsa-v2-image.yml"
  workflow_dispatch:

concurrency:
  group: publish-analisis-credito-precalentar-cache-credixsa-v2-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/red-unisol/analisis-credito-precalentar-cache-credixsa-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: kestra/automations/analisis-credito/docker/precalentar-cache-credixsa-v2
          file: kestra/automations/analisis-credito/docker/precalentar-cache-credixsa-v2/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
