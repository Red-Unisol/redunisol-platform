name: Publish Analisis Credito Precalentar Cache CredixSA V2 Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "kestra/automations/analisis-credito/docker/precalentar-cache-credixsa-v2/**"
      - "kestra/automations/analisis-credito/flows/precalentar_cache_credixsa_v2_sondeo.yaml"
      - ".github/workflows/publish-analisis-credito-precalentar-cache-credixsa-v2-image.yml"
      - 'kestra/tools/ci_image_tags.py'
  workflow_dispatch:

concurrency:
  group: publish-analisis-credito-precalentar-cache-credixsa-v2-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/red-unisol/analisis-credito-precalentar-cache-credixsa-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select branch publication tags
        id: image_tags
        shell: bash
        run: python kestra/tools/ci_image_tags.py --image-name "$IMAGE_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: kestra/automations/analisis-credito/docker/precalentar-cache-credixsa-v2
          file: kestra/automations/analisis-credito/docker/precalentar-cache-credixsa-v2/Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
