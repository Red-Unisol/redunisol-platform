name: Validate Herramientas

on:
  pull_request:
    paths:
      - 'web/herramientas/**'
      - '.github/workflows/validate-herramientas.yml'

permissions:
  contents: read

jobs:
  padrones:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/herramientas
    env:
      APP_KEY: 'base64:cHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHA='
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, zip, dom, xmlreader
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php artisan package:discover
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Test padrones, access and CredixSA integration
        run: php vendor/bin/phpunit --filter='PadronesTest|AnalisisTest|ConsultaQuiebraCredixTest'
      - name: Build production image
        run: docker build . -t herramientas:test
