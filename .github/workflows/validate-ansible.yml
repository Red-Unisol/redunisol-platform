name: Validate Ansible foundation

'on':
  pull_request:
    paths:
      - infra/ansible/**
      - infra/cloudflare/metamap-origin.yml
      - docs/dedicated-foundation.md
      - docs/metamap-dedicated-migration.md
      - docs/README.md
      - .github/workflows/validate-ansible.yml
  push:
    branches: [main]
    paths:
      - infra/ansible/**
      - infra/cloudflare/metamap-origin.yml
      - docs/dedicated-foundation.md
      - docs/metamap-dedicated-migration.md
      - docs/README.md
      - .github/workflows/validate-ansible.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg
      ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/ansible-local
      FOUNDATION_TEST_RESTIC_BINARY: ${{ runner.temp }}/redunisol-restic/restic
      FOUNDATION_TEST_FAIL2BAN_ROOT: ${{ runner.temp }}/redunisol-fail2ban
      METAMAP_TEST_APACHE_BINARY: /usr/sbin/apache2
      METAMAP_TEST_APACHE_MODULE_DIR: /usr/lib/apache2/modules
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            infra/ansible/requirements-control-node.txt
            infra/ansible/requirements-dev.txt
            infra/ansible/requirements-dev.lock
            apps/metamap-platform/server/pyproject.toml

      - name: Install pinned validation tooling
        run: |
          python -m pip install -r infra/ansible/requirements-dev.lock
          python -m pip check
          python -m pip install --dry-run --no-deps -r infra/ansible/requirements-dev.txt \
            --constraint infra/ansible/requirements-dev.lock

      - name: Show tooling versions
        run: |
          ansible --version
          ansible-lint --version
          yamllint --version

      - name: Install the MetaMap application for isolated shadow receiver tests
        run: |
          python -m pip install -e './apps/metamap-platform/server[dev]'
          python -m pip check

      - name: Install pinned Restic for isolated local tests
        run: python infra/ansible/tools/install-test-restic.py --directory "$RUNNER_TEMP/redunisol-restic"

      - name: Extract pinned Fail2ban for isolated local tests
        run: python infra/ansible/tools/install-test-fail2ban.py --directory "$RUNNER_TEMP/redunisol-fail2ban"

      - name: Install Apache binaries for isolated HTTPS tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apache2-bin openssl

      - name: Check infrastructure safety with isolated root-owned local fixtures
        run: |
          sudo env PATH="$PATH" ANSIBLE_CONFIG="$ANSIBLE_CONFIG" \
            FOUNDATION_TEST_RESTIC_BINARY="$FOUNDATION_TEST_RESTIC_BINARY" \
            FOUNDATION_TEST_FAIL2BAN_ROOT="$FOUNDATION_TEST_FAIL2BAN_ROOT" \
            METAMAP_TEST_APACHE_BINARY="$METAMAP_TEST_APACHE_BINARY" \
            METAMAP_TEST_APACHE_MODULE_DIR="$METAMAP_TEST_APACHE_MODULE_DIR" \
            bash infra/ansible/tools/run-local-tests.sh

      - name: Lint YAML
        working-directory: infra/ansible
        run: yamllint --strict . ../cloudflare/metamap-origin.yml ../../.github/workflows/validate-ansible.yml

      - name: Lint Ansible offline
        working-directory: infra/ansible
        run: ansible-lint --offline

      - name: Parse inventories without contacting hosts
        working-directory: infra/ansible
        run: |
          ansible-inventory -i inventories/production/hosts.yml --graph
          ansible-inventory -i inventories/integration/hosts.yml --graph

      - name: Check playbook syntax without contacting hosts
        working-directory: infra/ansible
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventories/production/hosts.yml "$playbook" --syntax-check
          done
