name: Publish Analisis Credito Consulta CUAD Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'kestra/automations/analisis-credito/docker/consulta-cuad/**'
      - 'kestra/automations/analisis-credito/flows/consulta_cuad.yaml'
      - '.github/workflows/publish-analisis-credito-consulta-cuad-image.yml'
      - 'kestra/tools/ci_image_tags.py'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-analisis-credito-consulta-cuad-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/red-unisol/analisis-credito-consulta-cuad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select branch publication tags
        id: image_tags
        shell: bash
        run: python kestra/tools/ci_image_tags.py --image-name "$IMAGE_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: kestra/automations/analisis-credito/docker/consulta-cuad
          file: kestra/automations/analisis-credito/docker/consulta-cuad/Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
