name: Publish BCRA File POC
on:
  push:
    branches: [main]
    paths:
      - "apps/bcra-file-api/**"
      - ".github/workflows/publish-bcra-file-api.yml"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-bcra-file-poc
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test parser, archive handling and persistent HTTP service
        run: docker build --target test -t bcra-file-poc:test apps/bcra-file-api
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/bcra-file-api
          target: runtime
          push: true
          tags: ghcr.io/red-unisol/bcra-file-api:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
