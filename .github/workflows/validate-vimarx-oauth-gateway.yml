name: Validate Vimarx OAuth Gateway

on:
  pull_request:
    paths:
      - 'apps/vimarx-oauth-gateway/**'
      - '.github/workflows/validate-vimarx-oauth-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vimarx-oauth-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: OAuth and proxy security tests
        run: python -m pytest tests -q
      - name: Compile sources
        run: python -m compileall -q gateway deploy
      - name: Build runtime image
        run: docker build -t vimarx-oauth-gateway:test .
