name: Deploy MetaMap Server Operativo

on:
  push:
    branches: [main]
    paths:
      - 'apps/metamap-platform/server/**'
      - '.github/workflows/deploy-metamap-server-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-metamap-server-dev
  cancel-in-progress: false

jobs:
  # Historical workflow/job names remain compatible; the operational host is dedicated.
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vps-infra
    env:
      IMAGE_NAME: ghcr.io/red-unisol/metamap-platform-server
      IMAGE_TAG: dev-${{ github.sha }}
      SSH_HOST: ${{ secrets.METAMAP_SSH_HOST }}
      SSH_PORT: ${{ secrets.METAMAP_SSH_PORT }}
      SSH_USER: ${{ secrets.METAMAP_SSH_USER }}
      PINNED_KNOWN_HOSTS: ${{ vars.METAMAP_SSH_KNOWN_HOSTS }}
      PUBLIC_HEALTHCHECK_URL: https://kestra.redunisol.com.ar/metamap-platform/health
    steps:
      - name: Allow manual operational deploy only from main by Nasst
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTOR" = "Nasst" ]
          [ "$GITHUB_REF" = "refs/heads/main" ]

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/metamap-platform/server
          file: apps/metamap-platform/server/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:dev-latest

      - name: Load dedicated SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.METAMAP_SSH_PRIVATE_KEY }}

      - name: Trust pinned dedicated host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_PORT" && test -n "$SSH_USER"
          test -n "$PINNED_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PINNED_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload dedicated deployment specification
        shell: bash
        run: |
          set -euo pipefail
          stage="/run/redunisol-metamap-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'REMOTE_STAGING_DIR=%s\n' "$stage" >> "$GITHUB_ENV"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "install -d -m 700 '$stage' '$stage/registry'"
          scp -P "$SSH_PORT" apps/metamap-platform/server/deploy/docker-compose.dedicated.yml "$SSH_USER@$SSH_HOST:$stage/compose.yml"
          scp -P "$SSH_PORT" apps/metamap-platform/server/deploy/deploy-dedicated.sh "$SSH_USER@$SSH_HOST:$stage/deploy.sh"

      - name: Authenticate dedicated image pull via stdin
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker --config '$REMOTE_STAGING_DIR/registry' login ghcr.io --username '$GHCR_USERNAME' --password-stdin" >/dev/null

      - name: Deploy on dedicated with a consistent pre-deploy backup
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash '$REMOTE_STAGING_DIR/deploy.sh' '$REMOTE_STAGING_DIR' '$GITHUB_SHA'"

      - name: Verify public revision
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30 -A 'MetaMap-Deployment-Verification/1.0' "$PUBLIC_HEALTHCHECK_URL" \
            | python3 -c 'import json,os,sys; v=json.load(sys.stdin); assert v["status"]=="ok" and v["git_sha"]==os.environ["GITHUB_SHA"]; print(v)'

      - name: Clean dedicated staging credentials
        if: always() && env.REMOTE_STAGING_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REMOTE_STAGING_DIR" =~ ^/run/redunisol-metamap-deploy-[0-9]+-[0-9]+$ ]]
          ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -rf -- '$REMOTE_STAGING_DIR'"
