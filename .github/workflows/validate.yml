name: Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r kestra/tools/requirements.txt
          pip install -r apps/credixsa-cache-api/requirements.txt
          pip install beautifulsoup4 pytest

      - name: Validate repository structure
        run: python kestra/tools/validate_kestra.py

      - name: Run encrypted env tooling tests
        run: python -m unittest kestra.tools.tests.test_manage_encrypted_env

      - name: Run runtime env validation tests
        run: python -m unittest kestra.tools.tests.test_validate_runtime_env

      - name: Validate Kestra runtime env contract
        run: |
          python kestra/tools/validate_runtime_env.py \
            --compose kestra/platform/infra/docker-compose.yml \
            --env kestra/platform/infra/kestra-runtime.env.enc \
            --allow-missing KESTRA_CONFIG_SHA256 \
            --allow-missing SECRET_AFIP_CONTACTO_WEBHOOK_KEY \
            --allow-missing ENV_EDNA_INCOMING_SUBJECT_ID \
            --allow-missing SECRET_EDNA_INCOMING_WEBHOOK_KEY \
            --allow-missing SECRET_SMTP_PASSWORD

      - name: Run deploy tooling tests
        run: python -m unittest kestra.tools.tests.test_deploy_kestra

      - name: Run alert sweep tests
        run: python -m pytest kestra/tools/tests/test_alerta_barrido.py -q

      - name: Verify infrastructure config-driven recreation
        run: python -m unittest kestra.tools.tests.test_infra_config_recreation

      - name: Run CredixSA flow contract tests
        run: python -m unittest kestra.tools.tests.test_credixsa_flow_contracts

      - name: Validate Zipline Dev Compose
        run: docker compose --env-file platform/zipline/zipline.dev.env.example -f platform/zipline/docker-compose.yml config -q

      - name: Validate Zipline Prod Compose
        run: docker compose --env-file platform/zipline/zipline.prod.env.example -f platform/zipline/docker-compose.yml config -q

      - name: Run Marketing CRM unit tests
        run: python -m unittest discover -s kestra/automations/marketing-crm/files/bitrix24_form_flow/tests -p "test_*.py"
        env:
          PYTHONPATH: kestra/automations/marketing-crm/files

      - name: Test durable Bitrix lead receiver
        working-directory: platform/bitrix-lead-receiver
        run: python -m unittest -v

      - name: Validate Bitrix receiver Compose
        run: |
          cp platform/bitrix-lead-receiver/.env.example platform/bitrix-lead-receiver/.env
          docker compose -f platform/bitrix-lead-receiver/docker-compose.yml config -q
          rm platform/bitrix-lead-receiver/.env

      - name: Run Marketing CRM report tests
        run: python -m unittest discover -s kestra/automations/marketing-crm/tests -p "test_*.py"

      - name: Build Bitrix lead receiver image
        run: docker build platform/bitrix-lead-receiver -t bitrix-lead-receiver:test

      - name: Run Analisis Credito unit tests
        run: python -m unittest discover -s kestra/automations/analisis-credito/tests -p "test_*.py"
        env:
          PYTHONPATH: kestra/automations/analisis-credito/files

      - name: Run Contabilidad unit tests
        run: python -m unittest discover -s kestra/automations/contabilidad/tests -p "test_*.py"
        env:
          PYTHONPATH: kestra/automations/contabilidad/files

      - name: Dry-run Marketing CRM deploy
        run: python kestra/tools/deploy_kestra.py --environment dev --domain marketing-crm --dry-run

      - name: Dry-run Analisis Credito deploy
        run: python kestra/tools/deploy_kestra.py --environment dev --domain analisis-credito --dry-run

      - name: Dry-run Contabilidad deploy
        run: python kestra/tools/deploy_kestra.py --environment dev --domain contabilidad --dry-run

      - name: Dry-run System deploy
        run: python kestra/tools/deploy_kestra.py --environment dev --target system --dry-run

      - name: Build ARCA Padron A13 image
        run: docker build kestra/automations/analisis-credito/docker/arca-padron-a13 -t analisis-credito-arca-padron-a13:test

      - name: Build Consulta CUAD image
        run: docker build kestra/automations/analisis-credito/docker/consulta-cuad -t analisis-credito-consulta-cuad:test

      - name: Build CredixSA worker image
        run: docker build kestra/automations/analisis-credito/docker/precalentar-cache-credixsa-v2 -t analisis-credito-credixsa:test

  edna-receiver:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost
    defaults:
      run:
        working-directory: web/redunisol-web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, zip, bcmath
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts
      - name: Discover packages
        run: |
          printf 'APP_URL=http://localhost\n' > .env
          php artisan package:discover
      - name: Test Edna HTTP inbox and delivery worker
        run: php vendor/bin/pest tests/Feature/EdnaIncomingTest.php tests/Feature/EdnaProbeTest.php
