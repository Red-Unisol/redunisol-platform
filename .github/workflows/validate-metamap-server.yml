name: Validate MetaMap Server

on:
  pull_request:
    paths:
      - 'apps/metamap-platform/server/**'
      - '.github/workflows/validate-metamap-server.yml'
      - '.github/workflows/validate-metamap-runtime-env.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/metamap-platform/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run server unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -t .

  runtime-env-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate encrypted runtime env structure
        run: |
          python - <<'PY'
          import base64
          import binascii
          from pathlib import Path

          required_keys = {
              "TARGET_DIR",
              "COMPOSE_PROJECT_NAME",
              "METAMAP_SERVER_DATABASE_URL",
              "METAMAP_SERVER_WEBHOOK_SECRET",
              "METAMAP_SERVER_BANK_CALLBACK_TOKEN",
              "METAMAP_SERVER_METAMAP_CLIENT_ID",
              "METAMAP_SERVER_METAMAP_CLIENT_SECRET",
              "METAMAP_SERVER_METAMAP_API_TOKEN",
              "METAMAP_SERVER_METAMAP_AUTH_SCHEME",
              "METAMAP_SERVER_METAMAP_TIMEOUT_SECONDS",
              "METAMAP_SERVER_METAMAP_MAX_ATTEMPTS",
              "METAMAP_SERVER_METAMAP_RETRY_BACKOFF_SECONDS",
              "METAMAP_SERVER_METAMAP_OAUTH_TOKEN_TTL_SECONDS",
              "METAMAP_SERVER_ENRICHMENT_WORKERS",
              "METAMAP_SERVER_ENRICHMENT_QUEUE_SIZE",
              "METAMAP_SERVER_BOOTSTRAP_CLIENTS_JSON",
          }
          for env_name in ("dev", "prod"):
              path = Path(
                  "apps/metamap-platform/server/deploy/"
                  f"metamap-platform-server.{env_name}.env.enc"
              )
              values = {}
              for line_number, raw_line in enumerate(path.read_text().splitlines(), 1):
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "=" not in line:
                      raise SystemExit(f"{path}:{line_number} is not KEY=VALUE")
                  key, value = line.split("=", 1)
                  if key in values:
                      raise SystemExit(f"{path}:{line_number} duplicates {key}")
                  try:
                      ciphertext = base64.b64decode(
                          value.encode("ascii"), altchars=b"-_", validate=True
                      )
                  except (UnicodeEncodeError, binascii.Error):
                      raise SystemExit(
                          f"{path}:{line_number} has invalid ciphertext"
                      ) from None
                  if len(ciphertext) < 16:
                      raise SystemExit(f"{path}:{line_number} has truncated ciphertext")
                  values[key] = value
              missing = sorted(required_keys - values.keys())
              if missing:
                  raise SystemExit(f"{path} missing keys: {', '.join(missing)}")
          print("Encrypted MetaMap runtime env structure is valid for dev and prod.")
          PY

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build apps/metamap-platform/server -t metamap-platform-server:test
