server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime antes de enviar. Importante en este proyecto: el bundle mas
    # grande pesa 7,9 MB sin comprimir y 2 MB comprimido.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos de assets llevan un hash en el nombre (index-a3f9c2.js).
    # Si cambia el contenido, cambia el nombre. Por eso se pueden cachear para
    # siempre sin riesgo de que el navegador sirva una version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NO se cachea: es el que apunta a los assets con hash y tiene
    # que reflejar siempre la ultima version desplegada.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

     # -----------------------------------------------------------
    # LA REGLA CLAVE DE UNA SPA
    #
    # Las rutas del frontend (/socios, /solicitudes/123) las maneja React
    # Router EN EL NAVEGADOR. No existen como archivos en el servidor.
    #
    # Sin esta linea, un usuario que entre directo a esa URL -- o que
    # simplemente refresque la pagina -- recibiria un 404.
    #
    # try_files dice: busca el archivo pedido; si no existe busca una carpeta
    # con ese nombre; y si tampoco, devolve index.html. Ahi carga la SPA, React
    # Router lee la URL y muestra la pantalla correcta.
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}