image: node:22

stages:
  - validate
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: validate
  script:
    - npm run lint

test:
  stage: validate
  script:
    - npm test

build:
  stage: build
  script:
    - npm run build
