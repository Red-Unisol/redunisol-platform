# Installed at /opt/apache/conf.d/30-prestamos-redunisol.conf on the web VPS.
# Keep this host intact: Laravel has a different redirect map for the old blog.
<VirtualHost *:80>
    ServerName prestamos.redunisol.com.ar

    Alias "/.well-known/acme-challenge/" "/opt/apache/htdocs/.well-known/acme-challenge/"
    <Directory "/opt/apache/htdocs/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://prestamos.redunisol.com.ar%{REQUEST_URI} [R=301,L]

    ErrorLog "logs/prestamos_redunisol_http_error.log"
    CustomLog "logs/prestamos_redunisol_http_access.log" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName prestamos.redunisol.com.ar

    SSLEngine on
    SSLCertificateFile "/etc/letsencrypt/live/prestamos.redunisol.com.ar/fullchain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/prestamos.redunisol.com.ar/privkey.pem"

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    RedirectMatch 301 ^/$ https://redunisol.com.ar/
    ProxyPass "/" "http://127.0.0.1:3021/" retry=0 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:3021/"

    ErrorLog "logs/prestamos_redunisol_https_error.log"
    CustomLog "logs/prestamos_redunisol_https_access.log" combined
</VirtualHost>
