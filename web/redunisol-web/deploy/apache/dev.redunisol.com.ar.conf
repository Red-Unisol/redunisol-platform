# Installed at /opt/apache/conf.d/22-redunisol-web-dev.conf on the web VPS.
<VirtualHost *:80>
    ServerName dev.redunisol.com.ar

    Alias "/.well-known/acme-challenge/" "/opt/apache/htdocs/.well-known/acme-challenge/"
    <Directory "/opt/apache/htdocs/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    ProxyPass "/.well-known/acme-challenge/" "!"

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog "logs/redunisol_web_dev_http_error.log"
    CustomLog "logs/redunisol_web_dev_http_access.log" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.redunisol.com.ar

    SSLEngine on
    SSLCertificateFile "/etc/letsencrypt/live/dev.redunisol.com.ar/fullchain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/dev.redunisol.com.ar/privkey.pem"

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # The agency explicitly retired this dev URL. Keep it independent of dev releases.
    RewriteEngine On
    RewriteRule ^/?prestamos-para-empleados-universidad-nacional-de-cordoba/?$ https://redunisol.com.ar/ [R=301,L]

    ProxyPass "/" "http://127.0.0.1:3020/" retry=0 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:3020/"

    ErrorLog "logs/redunisol_web_dev_https_error.log"
    CustomLog "logs/redunisol_web_dev_https_access.log" combined
</VirtualHost>
