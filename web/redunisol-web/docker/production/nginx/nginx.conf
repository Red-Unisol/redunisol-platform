events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    # Apache is the only ingress to this container. Use its client address for
    # a memory-only limiter; no database/cache/AOF writes for browser batches.
    limit_req_zone $http_x_forwarded_for zone=journey:10m rate=2r/s;

    server {
        listen 80;
        server_name localhost;

        root /var/www/public;
        index index.php index.html;

        # La IP de php-fpm cambia cuando se recrea el contenedor (reinicio de
        # la VPS, deploy). Con el nombre fijo en fastcgi_pass, nginx la resuelve
        # una sola vez al arrancar y queda apuntando a la IP vieja (502 el 22/10
        # y el 30/10). Con una variable y el DNS de Docker la vuelve a buscar.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_fpm php-fpm:9000;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /api/journey/events {
            client_max_body_size 48k;
            limit_req zone=journey burst=10 nodelay;
            limit_req_status 429;
            access_log off;
            fastcgi_pass $php_fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }

        location = /finalizar.php {
            fastcgi_pass $php_fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }

        location ~ \.php$ {
            fastcgi_pass $php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}
