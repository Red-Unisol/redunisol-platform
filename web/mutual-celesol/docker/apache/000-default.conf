<VirtualHost *:80>
    ServerName mutualcelesol.com
    DocumentRoot /var/www/html/public
    DirectoryIndex index.html index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "\.(?:bak|conf|config|dist|env|ini|log|sql|sqlite|yml|yaml)$">
        Require all denied
    </FilesMatch>

    RewriteEngine On
    RewriteRule ^/?\.well-known/ - [L]
    RewriteRule ^/?health\.php$ - [L]
    RewriteRule ^/?$ /celesol-web/ [R=302,L]
    RewriteCond %{REQUEST_URI} !^/celesol-web(?:/|$)
    RewriteRule ^/?(.*)$ /celesol-web/$1 [R=302,L]

    ErrorDocument 404 /celesol-web/404/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
