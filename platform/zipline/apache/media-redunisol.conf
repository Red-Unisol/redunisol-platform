<VirtualHost *:80>
    ServerName media.redunisol.com.ar

    Alias "/.well-known/acme-challenge/" "/opt/apache/htdocs/.well-known/acme-challenge/"
    <Directory "/opt/apache/htdocs/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    ProxyPass "/.well-known/acme-challenge/" "!"

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog "logs/media_redunisol_http_error.log"
    CustomLog "logs/media_redunisol_http_access.log" combined
</VirtualHost>

<VirtualHost *:443>
    ServerName media.redunisol.com.ar

    SSLEngine on
    SSLCertificateFile "/etc/letsencrypt/live/media.redunisol.com.ar/fullchain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/media.redunisol.com.ar/privkey.pem"

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass "/" "http://127.0.0.1:3041/" retry=0 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:3041/"

    ErrorLog "logs/media_redunisol_https_error.log"
    CustomLog "logs/media_redunisol_https_access.log" combined
</VirtualHost>
