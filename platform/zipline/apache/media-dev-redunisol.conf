<VirtualHost *:80>
    ServerName media-dev.redunisol.com.ar

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass "/" "http://127.0.0.1:3040/" retry=0 timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:3040/"

    ErrorLog "logs/media_dev_redunisol_error.log"
    CustomLog "logs/media_dev_redunisol_access.log" combined
</VirtualHost>

