services:
  receiver:
    build: .
    image: redunisol/bitrix-lead-receiver:${RECEIVER_REVISION:-local}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - receiver_data:/data
    networks:
      kestra:
        aliases: [bitrix-lead-receiver]
    mem_limit: 256m
    cpus: 1
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  receiver_data:
networks:
  kestra:
    external: true
    name: kestra_net
